<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="410" viewBox="0 0 1040 410" role="img" aria-labelledby="title desc" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif">
  <title id="title">不同递归分支重复到达OPT5</title>
  <desc id="desc">OPT8依赖OPT5与OPT7，OPT7依赖OPT6与OPT3，OPT6又依赖OPT5与OPT2。因此同一个OPT5会被重复求解，保存状态结果可以避免重复工作。图中只画出相关的部分依赖。</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#64748b"/></marker></defs>
  <rect width="1040" height="410" fill="#fff"/>
  <text x="30" y="43" font-size="27" font-weight="bold" fill="#263640">同一个前缀问题，可以由不同分支再次请求</text>
  <g fill="none" stroke="#64748b" stroke-width="2.3" marker-end="url(#arrow)"><path d="M225 135L445 104"/><path d="M225 150L445 217"/><path d="M585 217L735 155"/><path d="M585 230L735 284"/><path d="M805 130L587 93"/><path d="M875 155L925 222"/></g>
  <g stroke-width="1.5"><rect x="75" y="110" width="150" height="60" rx="5" fill="#edf5ff" stroke="#91afd1"/><rect x="445" y="70" width="140" height="60" rx="5" fill="#e5f4eb" stroke="#79ad91"/><rect x="445" y="195" width="140" height="60" rx="5" fill="#edf5ff" stroke="#91afd1"/><rect x="735" y="130" width="140" height="60" rx="5" fill="#edf5ff" stroke="#91afd1"/><rect x="735" y="260" width="140" height="60" rx="5" fill="#f5f5f5" stroke="#c3ccd4"/><rect x="905" y="223" width="105" height="60" rx="5" fill="#f5f5f5" stroke="#c3ccd4"/></g>
  <g font-size="24" text-anchor="middle" fill="#354351"><text x="150" y="148">OPT(8)</text><text x="515" y="108" fill="#267254">OPT(5)</text><text x="515" y="233">OPT(7)</text><text x="805" y="168">OPT(6)</text><text x="805" y="298">OPT(3)</text><text x="957" y="261">OPT(2)</text></g>
  <text x="270" y="220" font-size="20" fill="#667381">不选8</text><text x="290" y="89" font-size="20" fill="#267254">选8，接前5项</text>
  <path d="M30 346H1010" stroke="#dce3e8"/>
  <text x="30" y="385" font-size="22" fill="#354351">绿色状态被两条路径请求；缓存或自底向上填表，使每个状态只求解一次。</text>
</svg>
