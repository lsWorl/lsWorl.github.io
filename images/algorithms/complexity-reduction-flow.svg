<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="410" viewBox="0 0 1080 410" role="img" aria-labelledby="title desc" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif">
  <title id="title">把A实例变成B实例，借助B的求解器回答A</title>
  <desc id="desc">A归约到B。输入x先经过多项式时间转换f，得到B的实例f(x)，再调用B的求解器得到是或否。转换保持答案，x属于A当且仅当f(x)属于B。若B可多项式时间求解，A也可如此求解。</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#64748b"/></marker></defs>
  <rect width="1080" height="410" fill="#fff"/>
  <text x="30" y="46" font-size="27" font-weight="bold" fill="#263640">A ≤ₚ B：用 B 的求解能力，回答 A 的问题</text>
  <g fill="none" stroke="#64748b" stroke-width="2.4" marker-end="url(#arrow)"><path d="M210 158H275"/><path d="M535 158H600"/><path d="M840 158H900"/></g>
  <g stroke-width="1.5"><rect x="30" y="110" width="180" height="100" rx="5" fill="#edf5ff" stroke="#91afd1"/><rect x="285" y="97" width="250" height="126" rx="5" fill="#e5f4eb" stroke="#79ad91"/><rect x="610" y="110" width="230" height="100" rx="5" fill="#fff1e2" stroke="#c6a17a"/><rect x="910" y="110" width="140" height="100" rx="5" fill="#f5f5f5" stroke="#c3ccd4"/></g>
  <g font-size="25" font-weight="bold" text-anchor="middle" fill="#354351"><text x="120" y="151">A 的输入</text><text x="410" y="142" fill="#267254">多项式转换 f</text><text x="725" y="151" fill="#9b5b1c">B 的求解器</text><text x="980" y="151">是 / 否</text></g>
  <g font-size="22" text-anchor="middle" fill="#354351"><text x="120" y="188">x</text><text x="410" y="188">得到 B 实例 f(x)</text><text x="725" y="188">处理 f(x)</text><text x="980" y="188">回答 A</text></g>
  <path d="M30 268H1050" stroke="#dce3e8"/>
  <text x="30" y="312" font-size="23" fill="#267254">答案保持：x ∈ A ⇔ f(x) ∈ B。</text>
  <text x="30" y="357" font-size="22" fill="#354351">若 B 有多项式时间算法，转换后调用它，就得到 A 的多项式时间算法。</text>
</svg>
