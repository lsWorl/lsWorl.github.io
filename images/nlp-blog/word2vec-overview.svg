<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc">
  <title id="title">word2vec 总览</title>
  <desc id="desc">从文本语料出发，经过滑动窗口构造训练样本，训练词向量，再用于下游分类器。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#52616f"/>
    </marker>
  </defs>
  <rect width="1000" height="560" rx="18" fill="#fbfbfd"/>
  <text x="500" y="54" text-anchor="middle" font-family="Arial, Microsoft YaHei, sans-serif" font-size="30" font-weight="700" fill="#222831">从 word2vec 到神经网络分类器</text>
  <text x="500" y="88" text-anchor="middle" font-family="Arial, Microsoft YaHei, sans-serif" font-size="16" fill="#5f6b7a">word2vec 通过“上下文预测”训练词向量，再把词向量交给下游模型使用</text>

  <g font-family="Arial, Microsoft YaHei, sans-serif" text-anchor="middle">
    <rect x="70" y="165" width="150" height="88" rx="12" fill="#eaf3ff" stroke="#2f80ed" stroke-width="2"/>
    <text x="145" y="200" font-size="20" font-weight="700" fill="#222831">文本语料</text>
    <text x="145" y="227" font-size="14" fill="#5f6b7a">大量句子</text>

    <rect x="278" y="165" width="160" height="88" rx="12" fill="#fff8e8" stroke="#f2994a" stroke-width="2"/>
    <text x="358" y="200" font-size="20" font-weight="700" fill="#222831">滑动窗口</text>
    <text x="358" y="227" font-size="14" fill="#5f6b7a">中心词 / 上下文</text>

    <rect x="496" y="165" width="160" height="88" rx="12" fill="#f0fff4" stroke="#27ae60" stroke-width="2"/>
    <text x="576" y="200" font-size="20" font-weight="700" fill="#222831">预测任务</text>
    <text x="576" y="227" font-size="14" fill="#5f6b7a">CBOW / Skip-gram</text>

    <rect x="714" y="165" width="160" height="88" rx="12" fill="#f7f3ff" stroke="#9b51e0" stroke-width="2"/>
    <text x="794" y="200" font-size="20" font-weight="700" fill="#222831">词向量</text>
    <text x="794" y="227" font-size="14" fill="#5f6b7a">稠密语义表示</text>

    <rect x="358" y="350" width="220" height="92" rx="12" fill="#ffffff" stroke="#6b7280" stroke-width="2"/>
    <text x="468" y="385" font-size="20" font-weight="700" fill="#222831">神经网络分类器</text>
    <text x="468" y="413" font-size="14" fill="#5f6b7a">Embedding -> Pooling -> Linear</text>

    <rect x="650" y="350" width="170" height="92" rx="12" fill="#fff0f0" stroke="#eb5757" stroke-width="2"/>
    <text x="735" y="385" font-size="20" font-weight="700" fill="#222831">下游任务</text>
    <text x="735" y="413" font-size="14" fill="#5f6b7a">情感分类 / 意图识别</text>
  </g>

  <path d="M220 209 H267" stroke="#52616f" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M438 209 H485" stroke="#52616f" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M656 209 H703" stroke="#52616f" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M794 253 C790 325 578 315 515 346" fill="none" stroke="#52616f" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M578 396 H639" stroke="#52616f" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="206" y="492" width="588" height="42" rx="10" fill="#ffffff" stroke="#d4dbe5"/>
  <text x="500" y="519" text-anchor="middle" font-family="Arial, Microsoft YaHei, sans-serif" font-size="16" fill="#222831">核心直觉：一个词的意义，可以从它经常出现的上下文中学出来</text>
</svg>
