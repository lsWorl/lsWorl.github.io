<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc">
  <title id="title">Mini-GPT语言模型交叉熵</title><desc id="desc">每个位置的隐藏向量经过语言模型头得到词表logits，与右移目标计算交叉熵，所有batch与位置损失取平均。</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#52616f"/></marker></defs>
  <rect width="1000" height="620" rx="18" fill="#fbfbfd"/><text x="500" y="52" text-anchor="middle" font-family="Arial, Microsoft YaHei, sans-serif" font-size="30" font-weight="700" fill="#222831">语言模型损失：让正确的下一个 token 概率变大</text><text x="500" y="84" text-anchor="middle" font-family="Arial, Microsoft YaHei, sans-serif" font-size="16" fill="#5f6b7a">CrossEntropy 直接接收 logits，不需要提前 Softmax</text>
  <g font-family="Arial, Microsoft YaHei, sans-serif" text-anchor="middle">
    <rect x="55" y="140" width="185" height="80" rx="9" fill="#eaf3ff" stroke="#2f80ed" stroke-width="2"/><text x="147" y="173" font-size="18" font-weight="700" fill="#1f2937">隐藏向量 hₜ</text><text x="147" y="201" font-size="15" fill="#2f80ed">[C]</text>
    <rect x="285" y="140" width="185" height="80" rx="9" fill="#f7f3ff" stroke="#9b51e0" stroke-width="2"/><text x="377" y="173" font-size="18" font-weight="700" fill="#1f2937">LM Head</text><text x="377" y="201" font-size="15" fill="#6b21a8">C → V</text>
    <rect x="515" y="140" width="195" height="80" rx="9" fill="#fff7e6" stroke="#f2994a" stroke-width="2"/><text x="612" y="173" font-size="18" font-weight="700" fill="#1f2937">词表 logits zₜ</text><text x="612" y="201" font-size="15" fill="#d97706">[V]</text>
    <rect x="755" y="140" width="190" height="80" rx="9" fill="#f0fff4" stroke="#27ae60" stroke-width="2"/><text x="850" y="173" font-size="18" font-weight="700" fill="#1f2937">正确 token yₜ</text><text x="850" y="201" font-size="15" fill="#16803a">一个整数 id</text>
    <rect x="260" y="315" width="480" height="105" rx="11" fill="#fff" stroke="#d4dbe5" stroke-width="2"/><text x="500" y="349" font-size="20" font-weight="700" fill="#1f2937">单个位置负对数似然</text><text x="500" y="387" font-size="20" fill="#6b21a8">Lₜ = -log softmax(zₜ)[yₜ]</text>
    <rect x="145" y="495" width="710" height="75" rx="10" fill="#eefbf3" stroke="#27ae60" stroke-width="2"/><text x="500" y="526" font-size="19" font-weight="700" fill="#1f2937">对 B × T 个位置取平均</text><text x="500" y="554" font-size="17" fill="#166534">L = -(1 / BT) Σᵦ Σₜ log P(yᵦ,ₜ | xᵦ,≤ₜ)</text>
  </g>
  <path d="M240 180H275" stroke="#52616f" stroke-width="3" marker-end="url(#arrow)"/><path d="M470 180H505" stroke="#52616f" stroke-width="3" marker-end="url(#arrow)"/><path d="M612 220C612 260 545 275 525 305" fill="none" stroke="#f2994a" stroke-width="3" marker-end="url(#arrow)"/><path d="M850 220C850 275 660 280 585 305" fill="none" stroke="#27ae60" stroke-width="3" marker-end="url(#arrow)"/><path d="M500 420V485" stroke="#52616f" stroke-width="3" marker-end="url(#arrow)"/>
</svg>
