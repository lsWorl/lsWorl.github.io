<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="680" viewBox="0 0 1000 680" role="img" aria-labelledby="title desc">
  <title id="title">Mini-GPT整体结构</title><desc id="desc">token和位置Embedding相加，经过多个Pre-Norm GPT Block、最终LayerNorm和语言模型头，输出词表logits。</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#52616f"/></marker></defs>
  <rect width="1000" height="680" rx="18" fill="#fbfbfd"/>
  <text x="500" y="50" text-anchor="middle" font-family="Arial, Microsoft YaHei, sans-serif" font-size="30" font-weight="700" fill="#222831">Mini-GPT：Decoder-only 自回归语言模型</text>
  <text x="500" y="82" text-anchor="middle" font-family="Arial, Microsoft YaHei, sans-serif" font-size="16" fill="#5f6b7a">只保留 Causal Self-Attention 与 MLP，不需要 Encoder 和 Cross-Attention</text>
  <g font-family="Arial, Microsoft YaHei, sans-serif" text-anchor="middle">
    <rect x="55" y="140" width="180" height="72" rx="9" fill="#eaf3ff" stroke="#2f80ed" stroke-width="2"/><text x="145" y="170" font-size="19" font-weight="700" fill="#1f2937">Token ids</text><text x="145" y="197" font-size="15" fill="#2f80ed">[B, T]</text>
    <rect x="55" y="275" width="180" height="72" rx="9" fill="#fff7e6" stroke="#f2994a" stroke-width="2"/><text x="145" y="305" font-size="19" font-weight="700" fill="#1f2937">Position ids</text><text x="145" y="332" font-size="15" fill="#d97706">[T]</text>
    <rect x="290" y="140" width="210" height="72" rx="9" fill="#eaf3ff" stroke="#2f80ed" stroke-width="2"/><text x="395" y="170" font-size="18" font-weight="700" fill="#1f2937">Token Embedding</text><text x="395" y="197" font-size="15" fill="#2f80ed">[B, T, C]</text>
    <rect x="290" y="275" width="210" height="72" rx="9" fill="#fff7e6" stroke="#f2994a" stroke-width="2"/><text x="395" y="305" font-size="18" font-weight="700" fill="#1f2937">Position Embedding</text><text x="395" y="332" font-size="15" fill="#d97706">[T, C]</text>
    <circle cx="565" cy="244" r="31" fill="#fff" stroke="#9b51e0" stroke-width="2"/><text x="565" y="254" font-size="30" font-weight="700" fill="#7e22ce">+</text>
    <rect x="635" y="120" width="310" height="245" rx="13" fill="#f7f3ff" stroke="#9b51e0" stroke-width="2"/><text x="790" y="156" font-size="22" font-weight="700" fill="#1f2937">GPT Block × L</text>
    <rect x="675" y="183" width="230" height="64" rx="8" fill="#fff" stroke="#a78bca"/><text x="790" y="211" font-size="17" font-weight="700" fill="#1f2937">Pre-Norm Causal Attention</text><text x="790" y="234" font-size="13" fill="#52616f">只能查看当前位置与过去</text>
    <rect x="675" y="274" width="230" height="64" rx="8" fill="#fff" stroke="#a78bca"/><text x="790" y="302" font-size="17" font-weight="700" fill="#1f2937">Pre-Norm MLP</text><text x="790" y="325" font-size="13" fill="#52616f">Linear → GELU → Linear</text>
    <rect x="635" y="415" width="310" height="58" rx="9" fill="#f0fff4" stroke="#27ae60" stroke-width="2"/><text x="790" y="450" font-size="19" font-weight="700" fill="#1f2937">Final LayerNorm</text>
    <rect x="635" y="515" width="310" height="58" rx="9" fill="#eefbf3" stroke="#27ae60" stroke-width="2"/><text x="790" y="539" font-size="19" font-weight="700" fill="#1f2937">LM Head</text><text x="790" y="561" font-size="14" fill="#166534">[B, T, C] → [B, T, V]</text>
    <rect x="635" y="615" width="310" height="42" rx="8" fill="#fff" stroke="#d4dbe5"/><text x="790" y="642" font-size="16" fill="#334155">每个位置的 next-token logits</text>
    <rect x="80" y="468" width="455" height="105" rx="11" fill="#fff" stroke="#d4dbe5"/><text x="307" y="500" font-size="18" font-weight="700" fill="#1f2937">核心概率目标</text><text x="307" y="533" font-size="18" fill="#6b21a8">P(xₜ | x₁, x₂, ..., xₜ₋₁)</text><text x="307" y="558" font-size="14" fill="#52616f">同一组参数用于序列中的所有位置</text>
  </g>
  <path d="M235 176H280" stroke="#52616f" stroke-width="3" marker-end="url(#arrow)"/><path d="M235 311H280" stroke="#52616f" stroke-width="3" marker-end="url(#arrow)"/><path d="M500 176C535 176 525 216 535 228" fill="none" stroke="#2f80ed" stroke-width="3" marker-end="url(#arrow)"/><path d="M500 311C535 311 525 271 535 259" fill="none" stroke="#f2994a" stroke-width="3" marker-end="url(#arrow)"/><path d="M596 244H625" stroke="#52616f" stroke-width="3" marker-end="url(#arrow)"/><path d="M790 365V405" stroke="#52616f" stroke-width="3" marker-end="url(#arrow)"/><path d="M790 473V505" stroke="#52616f" stroke-width="3" marker-end="url(#arrow)"/><path d="M790 573V605" stroke="#52616f" stroke-width="3" marker-end="url(#arrow)"/>
</svg>
