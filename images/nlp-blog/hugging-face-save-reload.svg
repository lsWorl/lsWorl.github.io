<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="650" viewBox="0 0 1100 650" role="img" aria-labelledby="title desc">
  <title id="title">模型保存与重新加载</title>
  <desc id="desc">训练后的模型、Tokenizer 与配置共同保存到本地目录，之后可由 pipeline 或 AutoClass 重新加载并用于推理，也可选择上传到 Hub。</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#52616f"/></marker></defs>
  <rect width="1100" height="650" rx="16" fill="#fbfbfd"/>
  <g font-family="Arial, Microsoft YaHei, sans-serif">
    <text x="550" y="50" text-anchor="middle" font-size="30" font-weight="700" fill="#222831">保存的不只是模型权重</text>
    <text x="550" y="81" text-anchor="middle" font-size="16" fill="#5f6b7a">可复现推理需要模型、配置、Tokenizer 和标签语义一起移动</text>

    <rect x="55" y="135" width="240" height="120" rx="10" fill="#eaf3ff" stroke="#2f80ed" stroke-width="2"/>
    <text x="175" y="171" text-anchor="middle" font-size="20" font-weight="700" fill="#1f2937">训练完成</text>
    <text x="175" y="205" text-anchor="middle" font-size="15" fill="#2f5f9e">Trainer 中的最佳模型</text>
    <text x="175" y="231" text-anchor="middle" font-size="14" fill="#52616f">参数已适配当前任务</text>

    <path d="M295 195H350" stroke="#52616f" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="365" y="120" width="370" height="300" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="550" y="157" text-anchor="middle" font-size="21" font-weight="700" fill="#334155">final/ 本地模型目录</text>
    <g font-size="15" fill="#52616f">
      <rect x="405" y="184" width="290" height="42" rx="6" fill="#eefaf2" stroke="#a9d8b6"/><text x="430" y="211">model.safetensors</text>
      <rect x="405" y="237" width="290" height="42" rx="6" fill="#eaf3ff" stroke="#9bbce8"/><text x="430" y="264">config.json + id2label</text>
      <rect x="405" y="290" width="290" height="42" rx="6" fill="#f4effb" stroke="#c7a8e4"/><text x="430" y="317">tokenizer.json / vocab</text>
      <rect x="405" y="343" width="290" height="42" rx="6" fill="#fff7e6" stroke="#e9b872"/><text x="430" y="370">special token 与其他配置</text>
    </g>

    <path d="M735 195H790" stroke="#52616f" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="805" y="125" width="240" height="130" rx="10" fill="#eefaf2" stroke="#27ae60" stroke-width="2"/>
    <text x="925" y="161" text-anchor="middle" font-size="20" font-weight="700" fill="#1f2937">重新加载推理</text>
    <text x="925" y="195" text-anchor="middle" font-size="15" fill="#166534">pipeline(final_dir)</text>
    <text x="925" y="224" text-anchor="middle" font-size="15" fill="#166534">Auto*.from_pretrained</text>

    <path d="M550 420V473" stroke="#52616f" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="365" y="488" width="370" height="105" rx="10" fill="#fff7e6" stroke="#f2994a" stroke-width="2"/>
    <text x="550" y="524" text-anchor="middle" font-size="20" font-weight="700" fill="#1f2937">可选：上传到 Hub</text>
    <text x="550" y="556" text-anchor="middle" font-size="15" fill="#8a5418">身份认证 + Model Card + 许可证</text>
    <text x="550" y="580" text-anchor="middle" font-size="14" fill="#52616f">这是显式远程写入，不应在脚本中默认发生</text>

    <rect x="70" y="500" width="245" height="82" rx="9" fill="#fff" stroke="#d4dbe5"/>
    <text x="192" y="531" text-anchor="middle" font-size="17" font-weight="700" fill="#334155">save_pretrained</text>
    <text x="192" y="558" text-anchor="middle" font-size="14" fill="#52616f">目录可以完全在本地使用</text>

    <rect x="785" y="500" width="245" height="82" rx="9" fill="#fff" stroke="#d4dbe5"/>
    <text x="907" y="531" text-anchor="middle" font-size="17" font-weight="700" fill="#334155">push_to_hub</text>
    <text x="907" y="558" text-anchor="middle" font-size="14" fill="#52616f">便于版本管理与协作分享</text>
  </g>
</svg>
