<svg xmlns="http://www.w3.org/2000/svg" width="1150" height="700" viewBox="0 0 1150 700" role="img" aria-labelledby="title desc">
  <title id="title">TRL SFTTrainer 与 PEFT LoRA 整体流程</title>
  <desc id="desc">对话 messages 经过 Chat Template、Tokenizer 和 assistant mask，由 SFTTrainer 调用 LoRA 包装后的 Causal LM 完成训练并保存 Adapter。</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#52616f"/></marker></defs>
  <rect width="1150" height="700" rx="16" fill="#fbfbfd"/>
  <g font-family="Arial, Microsoft YaHei, sans-serif">
    <text x="575" y="50" text-anchor="middle" font-size="30" font-weight="700" fill="#222831">TRL 把 SFT 数据处理、Trainer 与 PEFT 串起来</text>
    <text x="575" y="80" text-anchor="middle" font-size="16" fill="#5f6b7a">自动化减少样板代码，但不会替代数据与模板检查</text>

    <rect x="45" y="125" width="220" height="125" rx="10" fill="#fff7e6" stroke="#f2994a" stroke-width="2"/>
    <text x="155" y="165" text-anchor="middle" font-size="20" font-weight="700" fill="#1f2937">Dataset</text>
    <text x="155" y="197" text-anchor="middle" font-size="15" fill="#8a5418">messages</text>
    <text x="155" y="223" text-anchor="middle" font-size="14" fill="#52616f">system / user / assistant</text>
    <path d="M265 188H315" stroke="#52616f" stroke-width="3" marker-end="url(#arrow)"/>

    <rect x="330" y="110" width="245" height="155" rx="10" fill="#f4effb" stroke="#9b51e0" stroke-width="2"/>
    <text x="452" y="150" text-anchor="middle" font-size="20" font-weight="700" fill="#1f2937">Chat Template</text>
    <text x="452" y="182" text-anchor="middle" font-size="14" fill="#6b3fa0">角色与消息边界</text>
    <text x="452" y="208" text-anchor="middle" font-size="14" fill="#6b3fa0">EOS 对齐</text>
    <text x="452" y="238" text-anchor="middle" font-size="14" fill="#52616f">标记 assistant generation span</text>
    <path d="M575 188H625" stroke="#52616f" stroke-width="3" marker-end="url(#arrow)"/>

    <rect x="640" y="110" width="235" height="155" rx="10" fill="#eaf3ff" stroke="#2f80ed" stroke-width="2"/>
    <text x="757" y="150" text-anchor="middle" font-size="20" font-weight="700" fill="#1f2937">SFT Processor</text>
    <text x="757" y="182" text-anchor="middle" font-size="14" fill="#2f5f9e">Tokenize / truncate</text>
    <text x="757" y="208" text-anchor="middle" font-size="14" fill="#2f5f9e">Assistant Mask</text>
    <text x="757" y="238" text-anchor="middle" font-size="14" fill="#52616f">labels = id / -100</text>
    <path d="M875 188H925" stroke="#52616f" stroke-width="3" marker-end="url(#arrow)"/>

    <rect x="940" y="125" width="165" height="125" rx="10" fill="#eaf3ff" stroke="#2f80ed" stroke-width="2"/>
    <text x="1022" y="165" text-anchor="middle" font-size="20" font-weight="700" fill="#1f2937">Collator</text>
    <text x="1022" y="197" text-anchor="middle" font-size="14" fill="#2f5f9e">Padding</text>
    <text x="1022" y="223" text-anchor="middle" font-size="14" fill="#52616f">tensor batch</text>

    <path d="M1022 250V315H835" fill="none" stroke="#52616f" stroke-width="3" marker-end="url(#arrow)"/>

    <rect x="300" y="330" width="550" height="165" rx="10" fill="#eefaf2" stroke="#27ae60" stroke-width="3"/>
    <text x="575" y="371" text-anchor="middle" font-size="24" font-weight="700" fill="#1f2937">PEFT-wrapped AutoModelForCausalLM</text>
    <text x="575" y="407" text-anchor="middle" font-size="16" fill="#166534">Frozen Base Weights + Trainable LoRA A/B</text>
    <text x="575" y="439" text-anchor="middle" font-size="15" fill="#52616f">forward -&gt; logits -&gt; assistant-only NLL</text>
    <text x="575" y="468" text-anchor="middle" font-size="14" fill="#52616f">只有 LoRA 参数 requires_grad=True</text>

    <path d="M300 412H230" stroke="#52616f" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="50" y="345" width="165" height="135" rx="10" fill="#fff2eb" stroke="#eb5757" stroke-width="2"/>
    <text x="132" y="385" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2937">SFTTrainer</text>
    <text x="132" y="417" text-anchor="middle" font-size="14" fill="#a83737">backward</text>
    <text x="132" y="443" text-anchor="middle" font-size="14" fill="#a83737">AdamW</text>
    <text x="132" y="466" text-anchor="middle" font-size="13" fill="#52616f">eval / save</text>

    <path d="M575 495V545" stroke="#52616f" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="150" y="560" width="355" height="100" rx="10" fill="#f4effb" stroke="#9b51e0" stroke-width="2"/>
    <text x="327" y="599" text-anchor="middle" font-size="20" font-weight="700" fill="#1f2937">Adapter Checkpoint</text>
    <text x="327" y="630" text-anchor="middle" font-size="14" fill="#6b3fa0">adapter weights + config</text>
    <path d="M505 610H575" stroke="#52616f" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="590" y="560" width="410" height="100" rx="10" fill="#fff7e6" stroke="#f2994a" stroke-width="2"/>
    <text x="795" y="599" text-anchor="middle" font-size="20" font-weight="700" fill="#1f2937">Base + Adapter + Tokenizer</text>
    <text x="795" y="630" text-anchor="middle" font-size="14" fill="#8a5418">apply_chat_template + generate</text>
  </g>
</svg>
