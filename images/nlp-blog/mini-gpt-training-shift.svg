<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="570" viewBox="0 0 1000 570" role="img" aria-labelledby="title desc">
  <title id="title">语言模型输入与目标右移</title><desc id="desc">连续字符被切成输入x与向右错开一个token的目标y，每个位置负责预测紧随其后的字符。</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#52616f"/></marker></defs>
  <rect width="1000" height="570" rx="18" fill="#fbfbfd"/><text x="500" y="52" text-anchor="middle" font-family="Arial, Microsoft YaHei, sans-serif" font-size="30" font-weight="700" fill="#222831">一个窗口，产生多个“预测下一个 token”样本</text><text x="500" y="84" text-anchor="middle" font-family="Arial, Microsoft YaHei, sans-serif" font-size="16" fill="#5f6b7a">目标序列相对输入序列向右错开一位</text>
  <g font-family="Arial, Microsoft YaHei, sans-serif" text-anchor="middle">
    <text x="105" y="175" font-size="20" font-weight="700" fill="#2f80ed">输入 x</text><text x="105" y="345" font-size="20" font-weight="700" fill="#16803a">目标 y</text>
    <rect x="180" y="130" width="130" height="75" rx="9" fill="#eaf3ff" stroke="#2f80ed" stroke-width="2"/><text x="245" y="176" font-size="25" fill="#1f2937">语</text><rect x="350" y="130" width="130" height="75" rx="9" fill="#eaf3ff" stroke="#2f80ed" stroke-width="2"/><text x="415" y="176" font-size="25" fill="#1f2937">言</text><rect x="520" y="130" width="130" height="75" rx="9" fill="#eaf3ff" stroke="#2f80ed" stroke-width="2"/><text x="585" y="176" font-size="25" fill="#1f2937">模</text><rect x="690" y="130" width="130" height="75" rx="9" fill="#eaf3ff" stroke="#2f80ed" stroke-width="2"/><text x="755" y="176" font-size="25" fill="#1f2937">型</text>
    <rect x="180" y="300" width="130" height="75" rx="9" fill="#f0fff4" stroke="#27ae60" stroke-width="2"/><text x="245" y="346" font-size="25" fill="#1f2937">言</text><rect x="350" y="300" width="130" height="75" rx="9" fill="#f0fff4" stroke="#27ae60" stroke-width="2"/><text x="415" y="346" font-size="25" fill="#1f2937">模</text><rect x="520" y="300" width="130" height="75" rx="9" fill="#f0fff4" stroke="#27ae60" stroke-width="2"/><text x="585" y="346" font-size="25" fill="#1f2937">型</text><rect x="690" y="300" width="130" height="75" rx="9" fill="#f0fff4" stroke="#27ae60" stroke-width="2"/><text x="755" y="346" font-size="25" fill="#1f2937">根</text>
    <text x="245" y="255" font-size="15" fill="#52616f">P(言 | 语)</text><text x="415" y="255" font-size="15" fill="#52616f">P(模 | 语言)</text><text x="585" y="255" font-size="15" fill="#52616f">P(型 | 语言模)</text><text x="755" y="255" font-size="15" fill="#52616f">P(根 | 语言模型)</text>
    <rect x="165" y="445" width="670" height="65" rx="10" fill="#f7f3ff" stroke="#9b51e0"/><text x="500" y="474" font-size="18" font-weight="700" fill="#1f2937">一次前向传播，同时监督 4 个位置</text><text x="500" y="499" font-size="15" fill="#6b21a8">batch 中共有 B × T 个交叉熵项</text>
  </g>
  <path d="M245 205V290" stroke="#52616f" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M415 205V290" stroke="#52616f" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M585 205V290" stroke="#52616f" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M755 205V290" stroke="#52616f" stroke-width="2.5" marker-end="url(#arrow)"/>
</svg>
