<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc">
  <title id="title">负采样训练 word2vec</title>
  <desc id="desc">负采样把预测整个词表改成判断中心词和上下文词是否真实共现。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#52616f"/>
    </marker>
  </defs>
  <rect width="1000" height="560" rx="18" fill="#fbfbfd"/>
  <text x="500" y="54" text-anchor="middle" font-family="Arial, Microsoft YaHei, sans-serif" font-size="30" font-weight="700" fill="#222831">负采样：把大分类问题变成真假判断</text>
  <text x="500" y="88" text-anchor="middle" font-family="Arial, Microsoft YaHei, sans-serif" font-size="16" fill="#5f6b7a">不再对整个词表做 softmax，而是让真实词对得分高、随机负样本得分低</text>

  <g font-family="Arial, Microsoft YaHei, sans-serif" text-anchor="middle">
    <rect x="95" y="185" width="170" height="86" rx="12" fill="#fff8e8" stroke="#f2994a" stroke-width="2"/>
    <text x="180" y="219" font-size="20" font-weight="700" fill="#222831">中心词</text>
    <text x="180" y="247" font-size="18" fill="#222831">喜欢</text>

    <rect x="365" y="132" width="170" height="70" rx="10" fill="#e8f7ee" stroke="#27ae60" stroke-width="2"/>
    <text x="450" y="176" font-size="18" font-weight="700" fill="#222831">真实上下文：自然语言</text>
    <rect x="365" y="234" width="170" height="70" rx="10" fill="#fff0f0" stroke="#eb5757" stroke-width="2"/>
    <text x="450" y="278" font-size="18" font-weight="700" fill="#222831">负样本：冰箱</text>
    <rect x="365" y="336" width="170" height="70" rx="10" fill="#fff0f0" stroke="#eb5757" stroke-width="2"/>
    <text x="450" y="380" font-size="18" font-weight="700" fill="#222831">负样本：火车</text>

    <rect x="655" y="164" width="230" height="210" rx="14" fill="#ffffff" stroke="#9dccd7" stroke-width="2"/>
    <text x="770" y="205" font-size="21" font-weight="700" fill="#222831">二分类目标</text>
    <text x="770" y="244" font-size="16" fill="#5f6b7a">真实词对 -> 1</text>
    <text x="770" y="276" font-size="16" fill="#5f6b7a">负样本词对 -> 0</text>
    <text x="770" y="318" font-size="16" fill="#222831">score = v中心 · v上下文</text>
    <text x="770" y="348" font-size="16" fill="#222831">sigmoid(score)</text>
  </g>

  <path d="M265 228 C310 206 325 170 355 167" stroke="#52616f" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M265 228 H354" stroke="#52616f" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M265 228 C310 288 325 365 355 371" stroke="#52616f" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M535 167 C590 180 610 205 644 229" stroke="#52616f" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M535 269 H644" stroke="#52616f" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M535 371 C590 355 610 330 644 310" stroke="#52616f" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

  <rect x="224" y="470" width="552" height="42" rx="10" fill="#ffffff" stroke="#d4dbe5"/>
  <text x="500" y="497" text-anchor="middle" font-family="Arial, Microsoft YaHei, sans-serif" font-size="16" fill="#222831">训练后，经常一起出现的词向量点积更大，语义无关词向量点积更小</text>
</svg>
