<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="650" viewBox="0 0 1000 650" role="img" aria-labelledby="title desc">
  <title id="title">Mini-GPT QKV拆头和合并头形状</title><desc id="desc">输入经过C到3C线性层并切成QKV，拆成H个D维注意力头，计算注意力，再合并回C维。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#52616f"/></marker></defs>
  <rect width="1000" height="650" rx="18" fill="#fbfbfd"/><text x="500" y="52" text-anchor="middle" font-family="Arial, Microsoft YaHei, sans-serif" font-size="30" font-weight="700" fill="#222831">QKV 张量形状：拆头之后再合并</text><text x="500" y="84" text-anchor="middle" font-family="Arial, Microsoft YaHei, sans-serif" font-size="16" fill="#5f6b7a">B=batch，T=序列长度，C=n_embd，H=n_head，D=C/H</text>
  <g font-family="Arial, Microsoft YaHei, sans-serif" text-anchor="middle">
    <rect x="60" y="135" width="180" height="75" rx="9" fill="#eaf3ff" stroke="#2f80ed" stroke-width="2"/><text x="150" y="166" font-size="19" font-weight="700" fill="#1f2937">输入 x</text><text x="150" y="193" font-size="16" fill="#2f80ed">[B, T, C]</text><rect x="310" y="135" width="200" height="75" rx="9" fill="#fff7e6" stroke="#f2994a" stroke-width="2"/><text x="410" y="166" font-size="18" font-weight="700" fill="#1f2937">Linear(C, 3C)</text><text x="410" y="193" font-size="16" fill="#d97706">[B, T, 3C]</text><rect x="580" y="125" width="360" height="95" rx="10" fill="#f7f3ff" stroke="#9b51e0" stroke-width="2"/><text x="760" y="157" font-size="19" font-weight="700" fill="#1f2937">split(C, dim=-1)</text><text x="670" y="193" font-size="15" fill="#6b21a8">Q [B,T,C]</text><text x="760" y="193" font-size="15" fill="#6b21a8">K [B,T,C]</text><text x="850" y="193" font-size="15" fill="#6b21a8">V [B,T,C]</text>
    <rect x="80" y="310" width="250" height="90" rx="10" fill="#eaf3ff" stroke="#2f80ed" stroke-width="2"/><text x="205" y="342" font-size="18" font-weight="700" fill="#1f2937">view + transpose</text><text x="205" y="372" font-size="16" fill="#2f80ed">[B, H, T, D]</text><rect x="390" y="310" width="250" height="90" rx="10" fill="#fff7e6" stroke="#f2994a" stroke-width="2"/><text x="515" y="342" font-size="18" font-weight="700" fill="#1f2937">Attention weights</text><text x="515" y="372" font-size="16" fill="#d97706">[B, H, T, T]</text><rect x="700" y="310" width="220" height="90" rx="10" fill="#f0fff4" stroke="#27ae60" stroke-width="2"/><text x="810" y="342" font-size="18" font-weight="700" fill="#1f2937">weights @ V</text><text x="810" y="372" font-size="16" fill="#16803a">[B, H, T, D]</text>
    <rect x="185" y="500" width="270" height="82" rx="10" fill="#f7f3ff" stroke="#9b51e0" stroke-width="2"/><text x="320" y="531" font-size="17" font-weight="700" fill="#1f2937">transpose + contiguous</text><text x="320" y="560" font-size="16" fill="#6b21a8">[B, T, H, D]</text><rect x="545" y="500" width="270" height="82" rx="10" fill="#eefbf3" stroke="#27ae60" stroke-width="2"/><text x="680" y="531" font-size="18" font-weight="700" fill="#1f2937">view + output proj</text><text x="680" y="560" font-size="16" fill="#16803a">[B, T, C]</text><rect x="225" y="610" width="550" height="30" rx="7" fill="#fff" stroke="#d4dbe5"/><text x="500" y="631" font-size="14" fill="#334155">本例：C=96，H=4，D=24，因此 H × D = C</text>
  </g><path d="M240 172H300" stroke="#52616f" stroke-width="3" marker-end="url(#arrow)"/><path d="M510 172H570" stroke="#52616f" stroke-width="3" marker-end="url(#arrow)"/><path d="M760 220C760 265 230 265 215 300" fill="none" stroke="#52616f" stroke-width="3" marker-end="url(#arrow)"/><path d="M330 355H380" stroke="#52616f" stroke-width="3" marker-end="url(#arrow)"/><path d="M640 355H690" stroke="#52616f" stroke-width="3" marker-end="url(#arrow)"/><path d="M810 400C810 450 340 450 325 490" fill="none" stroke="#52616f" stroke-width="3" marker-end="url(#arrow)"/><path d="M455 541H535" stroke="#52616f" stroke-width="3" marker-end="url(#arrow)"/>
</svg>
