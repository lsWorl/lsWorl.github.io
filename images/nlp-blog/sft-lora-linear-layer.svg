<svg xmlns="http://www.w3.org/2000/svg" width="1150" height="680" viewBox="0 0 1150 680" role="img" aria-labelledby="title desc">
  <title id="title">LoRA 如何插入 Causal LM 线性层</title>
  <desc id="desc">冻结的原矩阵 W 与可训练的低秩 A B 分支并行计算，按 alpha 除以 rank 缩放后相加形成输出。</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#52616f"/></marker></defs>
  <rect width="1150" height="680" rx="16" fill="#fbfbfd"/>
  <g font-family="Arial, Microsoft YaHei, sans-serif">
    <text x="575" y="50" text-anchor="middle" font-size="30" font-weight="700" fill="#222831">LoRA 冻结 W，只训练低秩增量 BA</text>
    <text x="575" y="80" text-anchor="middle" font-size="16" fill="#5f6b7a">SFT Loss 不变，允许更新的参数集合改变</text>

    <rect x="55" y="270" width="145" height="90" rx="10" fill="#eaf3ff" stroke="#2f80ed" stroke-width="2"/>
    <text x="127" y="310" text-anchor="middle" font-size="23" font-weight="700" fill="#1f2937">x</text>
    <text x="127" y="339" text-anchor="middle" font-size="14" fill="#2f5f9e">[d_in]</text>
    <path d="M200 315H280V205H330" fill="none" stroke="#52616f" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M200 315H280V440H330" fill="none" stroke="#52616f" stroke-width="3" marker-end="url(#arrow)"/>

    <rect x="345" y="145" width="265" height="120" rx="10" fill="#f1f3f5" stroke="#94a3b8" stroke-width="2"/>
    <text x="477" y="185" text-anchor="middle" font-size="22" font-weight="700" fill="#334155">Frozen W</text>
    <text x="477" y="219" text-anchor="middle" font-size="15" fill="#52616f">[d_out, d_in]</text>
    <text x="477" y="246" text-anchor="middle" font-size="15" fill="#6b7280">requires_grad=False</text>

    <rect x="345" y="380" width="160" height="120" rx="10" fill="#eefaf2" stroke="#27ae60" stroke-width="2"/>
    <text x="425" y="420" text-anchor="middle" font-size="22" font-weight="700" fill="#166534">A</text>
    <text x="425" y="452" text-anchor="middle" font-size="15" fill="#52616f">[r, d_in]</text>
    <text x="425" y="479" text-anchor="middle" font-size="14" fill="#166534">trainable</text>
    <path d="M505 440H545" stroke="#52616f" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="560" y="380" width="160" height="120" rx="10" fill="#eefaf2" stroke="#27ae60" stroke-width="2"/>
    <text x="640" y="420" text-anchor="middle" font-size="22" font-weight="700" fill="#166534">B</text>
    <text x="640" y="452" text-anchor="middle" font-size="15" fill="#52616f">[d_out, r]</text>
    <text x="640" y="479" text-anchor="middle" font-size="14" fill="#166534">trainable</text>
    <path d="M720 440H765" stroke="#52616f" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="780" y="395" width="125" height="90" rx="10" fill="#fff7e6" stroke="#f2994a" stroke-width="2"/>
    <text x="842" y="430" text-anchor="middle" font-size="20" font-weight="700" fill="#8a5418">scale</text>
    <text x="842" y="461" text-anchor="middle" font-size="17" fill="#8a5418">alpha / r</text>

    <path d="M610 205H945V280" fill="none" stroke="#52616f" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M905 440H945V350" fill="none" stroke="#52616f" stroke-width="3" marker-end="url(#arrow)"/>
    <circle cx="945" cy="315" r="32" fill="#fff" stroke="#9b51e0" stroke-width="3"/>
    <text x="945" y="325" text-anchor="middle" font-size="28" font-weight="700" fill="#6b3fa0">+</text>
    <path d="M977 315H1030" stroke="#52616f" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="1045" y="270" width="70" height="90" rx="10" fill="#f4effb" stroke="#9b51e0" stroke-width="2"/>
    <text x="1080" y="310" text-anchor="middle" font-size="22" font-weight="700" fill="#1f2937">y</text>
    <text x="1080" y="338" text-anchor="middle" font-size="13" fill="#6b3fa0">[d_out]</text>

    <rect x="140" y="565" width="870" height="70" rx="10" fill="#fff" stroke="#d4dbe5" stroke-width="2"/>
    <text x="575" y="592" text-anchor="middle" font-size="18" font-weight="700" fill="#334155">y = Wx + (alpha / r) BAx</text>
    <text x="575" y="620" text-anchor="middle" font-size="15" fill="#52616f">参数量从 d_out*d_in 的完整更新，变为 r*(d_in+d_out) 的增量更新</text>
  </g>
</svg>
