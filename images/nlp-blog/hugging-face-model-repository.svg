<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="700" viewBox="0 0 1100 700" role="img" aria-labelledby="title desc">
  <title id="title">Hugging Face 模型仓库结构</title>
  <desc id="desc">模型仓库包含模型卡、结构配置、权重、Tokenizer 资产和可选生成配置，各文件共同组成可复现的模型发布。</desc>
  <rect width="1100" height="700" rx="16" fill="#fbfbfd"/>
  <g font-family="Arial, Microsoft YaHei, sans-serif">
    <text x="550" y="50" text-anchor="middle" font-size="30" font-weight="700" fill="#222831">一个模型仓库不只有权重文件</text>
    <text x="550" y="81" text-anchor="middle" font-size="16" fill="#5f6b7a">仓库 ID：organization/model-name</text>

    <rect x="60" y="120" width="980" height="500" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="60" y="120" width="980" height="64" rx="12" fill="#eef2f7"/>
    <text x="95" y="160" font-size="21" font-weight="700" fill="#334155">model repository /</text>

    <rect x="95" y="215" width="270" height="110" rx="9" fill="#fff7e6" stroke="#f2994a" stroke-width="2"/>
    <text x="230" y="248" text-anchor="middle" font-size="20" font-weight="700" fill="#1f2937">README.md</text>
    <text x="230" y="276" text-anchor="middle" font-size="15" fill="#8a5418">Model Card</text>
    <text x="230" y="300" text-anchor="middle" font-size="14" fill="#52616f">用途、指标、许可、限制</text>

    <rect x="415" y="215" width="270" height="110" rx="9" fill="#eaf3ff" stroke="#2f80ed" stroke-width="2"/>
    <text x="550" y="248" text-anchor="middle" font-size="20" font-weight="700" fill="#1f2937">config.json</text>
    <text x="550" y="276" text-anchor="middle" font-size="15" fill="#2f5f9e">模型结构与任务配置</text>
    <text x="550" y="300" text-anchor="middle" font-size="14" fill="#52616f">层数、维度、标签映射</text>

    <rect x="735" y="215" width="270" height="110" rx="9" fill="#eefaf2" stroke="#27ae60" stroke-width="2"/>
    <text x="870" y="248" text-anchor="middle" font-size="20" font-weight="700" fill="#1f2937">model.safetensors</text>
    <text x="870" y="276" text-anchor="middle" font-size="15" fill="#166534">训练后的参数张量</text>
    <text x="870" y="300" text-anchor="middle" font-size="14" fill="#52616f">大型模型可拆成多个 shard</text>

    <rect x="95" y="365" width="430" height="150" rx="9" fill="#f4effb" stroke="#9b51e0" stroke-width="2"/>
    <text x="310" y="399" text-anchor="middle" font-size="20" font-weight="700" fill="#1f2937">Tokenizer 资产</text>
    <text x="125" y="435" font-size="15" fill="#52616f">tokenizer.json</text>
    <text x="125" y="463" font-size="15" fill="#52616f">tokenizer_config.json</text>
    <text x="340" y="435" font-size="15" fill="#52616f">special_tokens_map.json</text>
    <text x="340" y="463" font-size="15" fill="#52616f">vocab / merges</text>
    <text x="310" y="495" text-anchor="middle" font-size="14" fill="#6b3fa0">切分规则、词表与特殊 token 必须匹配模型</text>

    <rect x="575" y="365" width="430" height="150" rx="9" fill="#eef7ff" stroke="#2d9cdb" stroke-width="2"/>
    <text x="790" y="399" text-anchor="middle" font-size="20" font-weight="700" fill="#1f2937">其他可选资产</text>
    <text x="610" y="435" font-size="15" fill="#52616f">generation_config.json</text>
    <text x="610" y="463" font-size="15" fill="#52616f">processor_config.json</text>
    <text x="825" y="435" font-size="15" fill="#52616f">自定义代码</text>
    <text x="825" y="463" font-size="15" fill="#52616f">索引与分片信息</text>
    <text x="790" y="495" text-anchor="middle" font-size="14" fill="#176b8d">具体文件取决于架构和模态</text>

    <rect x="145" y="555" width="810" height="42" rx="7" fill="#fff" stroke="#d4dbe5"/>
    <text x="550" y="582" text-anchor="middle" font-size="16" fill="#334155">from_pretrained() 会组合这些资产，而不是只下载一个神经网络文件</text>
  </g>
</svg>
