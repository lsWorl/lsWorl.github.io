<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="700" viewBox="0 0 1100 700" role="img" aria-labelledby="title desc">
  <title id="title">RoPE 在注意力中的整体位置</title>
  <desc id="desc">隐藏状态先投影为查询键和值，只对查询和键应用旋转位置编码，再计算注意力并聚合值。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#52616f"/></marker>
  </defs>
  <rect width="1100" height="700" rx="16" fill="#fbfbfd"/>
  <g font-family="Arial, Microsoft YaHei, sans-serif">
    <text x="550" y="52" text-anchor="middle" font-size="30" font-weight="700" fill="#222831">RoPE 在 Self-Attention 中做了什么</text>
    <text x="550" y="82" text-anchor="middle" font-size="16" fill="#5f6b7a">位置参与 Query-Key 匹配，Value 保留内容并接受权重聚合</text>

    <rect x="405" y="110" width="290" height="70" rx="10" fill="#eaf3ff" stroke="#2f80ed" stroke-width="2"/>
    <text x="550" y="139" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2937">Hidden State X</text>
    <text x="550" y="164" text-anchor="middle" font-size="15" fill="#52616f">[B, T, C]</text>

    <path d="M550 180V218" stroke="#52616f" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="565" y="207" font-size="14" fill="#52616f">Linear</text>

    <rect x="85" y="230" width="250" height="76" rx="10" fill="#eaf3ff" stroke="#2f80ed" stroke-width="2"/>
    <rect x="425" y="230" width="250" height="76" rx="10" fill="#eaf3ff" stroke="#2f80ed" stroke-width="2"/>
    <rect x="765" y="230" width="250" height="76" rx="10" fill="#eefaf2" stroke="#27ae60" stroke-width="2"/>
    <text x="210" y="263" text-anchor="middle" font-size="22" font-weight="700" fill="#1f2937">Query Q</text>
    <text x="550" y="263" text-anchor="middle" font-size="22" font-weight="700" fill="#1f2937">Key K</text>
    <text x="890" y="263" text-anchor="middle" font-size="22" font-weight="700" fill="#1f2937">Value V</text>
    <text x="210" y="289" text-anchor="middle" font-size="14" fill="#52616f">[B, H, T, D]</text>
    <text x="550" y="289" text-anchor="middle" font-size="14" fill="#52616f">[B, H, T, D]</text>
    <text x="890" y="289" text-anchor="middle" font-size="14" fill="#52616f">不旋转</text>

    <path d="M210 306V348" stroke="#52616f" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M550 306V348" stroke="#52616f" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M890 306V476H790" fill="none" stroke="#27ae60" stroke-width="3" marker-end="url(#arrow)"/>

    <rect x="75" y="360" width="270" height="92" rx="10" fill="#fff7e6" stroke="#f2994a" stroke-width="2"/>
    <rect x="415" y="360" width="270" height="92" rx="10" fill="#fff7e6" stroke="#f2994a" stroke-width="2"/>
    <text x="210" y="394" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2937">R(position) Q</text>
    <text x="550" y="394" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2937">R(position) K</text>
    <text x="210" y="422" text-anchor="middle" font-size="15" fill="#9a5a12">按位置旋转 Query</text>
    <text x="550" y="422" text-anchor="middle" font-size="15" fill="#9a5a12">按位置旋转 Key</text>
    <text x="210" y="443" text-anchor="middle" font-size="13" fill="#52616f">RoPE</text>
    <text x="550" y="443" text-anchor="middle" font-size="13" fill="#52616f">RoPE</text>

    <path d="M210 452V490H365" fill="none" stroke="#52616f" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M550 452V490H485" fill="none" stroke="#52616f" stroke-width="3" marker-end="url(#arrow)"/>

    <rect x="355" y="475" width="280" height="86" rx="10" fill="#f4effb" stroke="#9b51e0" stroke-width="2"/>
    <text x="495" y="509" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">QKᵀ / √D + Mask</text>
    <text x="495" y="537" text-anchor="middle" font-size="15" fill="#6b3fa0">Softmax 得到位置相关权重</text>

    <path d="M635 518H732" stroke="#52616f" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="745" y="470" width="270" height="96" rx="10" fill="#eefaf2" stroke="#27ae60" stroke-width="2"/>
    <text x="880" y="505" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2937">Attention Weight × V</text>
    <text x="880" y="535" text-anchor="middle" font-size="15" fill="#166534">聚合真正的内容</text>

    <path d="M880 566V608" stroke="#52616f" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="670" y="620" width="420" height="50" rx="8" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="880" y="652" text-anchor="middle" font-size="17" font-weight="700" fill="#334155">输出 [B, T, C]</text>

    <rect x="70" y="615" width="500" height="58" rx="8" fill="#fff" stroke="#d4dbe5"/>
    <text x="320" y="640" text-anchor="middle" font-size="15" fill="#334155">关键：先旋转 Q、K，再计算点积</text>
    <text x="320" y="661" text-anchor="middle" font-size="14" fill="#52616f">RoPE 不替代 Causal Mask，也不直接修改 Value</text>
  </g>
</svg>
