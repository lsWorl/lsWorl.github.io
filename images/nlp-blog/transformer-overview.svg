<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="650" viewBox="0 0 1000 650" role="img" aria-labelledby="title desc">
  <title id="title">Transformer Encoder-Decoder整体结构</title>
  <desc id="desc">源序列经过Embedding、位置编码和Encoder，目标前缀经过Decoder并读取Encoder Memory，最后输出词表概率。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#52616f"/></marker>
  </defs>
  <rect width="1000" height="650" rx="18" fill="#fbfbfd"/>
  <text x="500" y="52" text-anchor="middle" font-family="Arial, Microsoft YaHei, sans-serif" font-size="30" font-weight="700" fill="#222831">Transformer：并行理解输入，逐步生成输出</text>
  <text x="500" y="84" text-anchor="middle" font-family="Arial, Microsoft YaHei, sans-serif" font-size="16" fill="#5f6b7a">Encoder 产生 Memory，Decoder 通过 Cross-Attention 读取它</text>

  <g font-family="Arial, Microsoft YaHei, sans-serif" text-anchor="middle">
    <rect x="50" y="120" width="390" height="420" rx="14" fill="#eaf3ff" stroke="#2f80ed" stroke-width="2"/>
    <text x="245" y="157" font-size="25" font-weight="700" fill="#1f2937">Transformer Encoder</text>
    <rect x="92" y="455" width="306" height="54" rx="8" fill="#fff" stroke="#9bbce8"/>
    <text x="245" y="489" font-size="17" fill="#334155">源 Embedding + 位置编码</text>
    <rect x="92" y="330" width="306" height="88" rx="9" fill="#dcecff" stroke="#2f80ed"/>
    <text x="245" y="363" font-size="18" font-weight="700" fill="#1f2937">Encoder Layer × N</text>
    <text x="245" y="392" font-size="15" fill="#52616f">Self-Attention + FFN</text>
    <rect x="92" y="210" width="306" height="82" rx="9" fill="#fff" stroke="#2f80ed" stroke-width="2"/>
    <text x="245" y="245" font-size="20" font-weight="700" fill="#1f2937">Memory</text>
    <text x="245" y="273" font-size="14" fill="#52616f">每个源 token 的上下文表示</text>

    <rect x="560" y="120" width="390" height="420" rx="14" fill="#f0fff4" stroke="#27ae60" stroke-width="2"/>
    <text x="755" y="157" font-size="25" font-weight="700" fill="#1f2937">Transformer Decoder</text>
    <rect x="602" y="455" width="306" height="54" rx="8" fill="#fff" stroke="#9ed2ad"/>
    <text x="755" y="489" font-size="17" fill="#334155">目标 Embedding + 位置编码</text>
    <rect x="602" y="306" width="306" height="112" rx="9" fill="#def7e6" stroke="#27ae60"/>
    <text x="755" y="340" font-size="18" font-weight="700" fill="#1f2937">Decoder Layer × N</text>
    <text x="755" y="369" font-size="15" fill="#52616f">Masked Self-Attention</text>
    <text x="755" y="395" font-size="15" fill="#52616f">Cross-Attention + FFN</text>
    <rect x="602" y="210" width="306" height="58" rx="9" fill="#fff" stroke="#27ae60"/>
    <text x="755" y="246" font-size="18" fill="#1f2937">Linear + Softmax</text>
  </g>

  <path d="M245 455V428" stroke="#52616f" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M245 330V302" stroke="#52616f" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M755 455V428" stroke="#52616f" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M755 306V278" stroke="#52616f" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M398 251C490 251 500 362 590 362" fill="none" stroke="#9b51e0" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="500" y="305" text-anchor="middle" font-family="Arial, Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#7e22ce">K、V</text>

  <g font-family="Arial, Microsoft YaHei, sans-serif" text-anchor="middle">
    <rect x="92" y="576" width="306" height="48" rx="8" fill="#fff" stroke="#d4dbe5"/>
    <text x="245" y="606" font-size="16" fill="#334155">源 token：我 喜欢 NLP</text>
    <rect x="602" y="576" width="306" height="48" rx="8" fill="#fff" stroke="#d4dbe5"/>
    <text x="755" y="606" font-size="16" fill="#334155">目标前缀：BOS I like</text>
    <text x="938" y="241" font-size="14" fill="#52616f" transform="rotate(90 938 241)">下一个 token</text>
  </g>
  <path d="M755 210V182" stroke="#52616f" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M245 576V519" stroke="#52616f" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M755 576V519" stroke="#52616f" stroke-width="3" marker-end="url(#arrow)"/>
</svg>
