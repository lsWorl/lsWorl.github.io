<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="660" viewBox="0 0 1000 660" role="img" aria-labelledby="title desc">
  <title id="title">GPT因果自注意力</title><desc id="desc">Q与K计算缩放点积后，未来位置由因果遮罩设为负无穷，Softmax后权重为零，再对V加权求和。</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#52616f"/></marker></defs>
  <rect width="1000" height="660" rx="18" fill="#fbfbfd"/><text x="500" y="52" text-anchor="middle" font-family="Arial, Microsoft YaHei, sans-serif" font-size="30" font-weight="700" fill="#222831">Causal Self-Attention：并行计算，但不泄漏未来</text><text x="500" y="84" text-anchor="middle" font-family="Arial, Microsoft YaHei, sans-serif" font-size="16" fill="#5f6b7a">Mᵢⱼ = 0（j ≤ i），Mᵢⱼ = -∞（j &gt; i）</text>
  <g font-family="Arial, Microsoft YaHei, sans-serif" text-anchor="middle">
    <rect x="45" y="125" width="190" height="90" rx="10" fill="#eaf3ff" stroke="#2f80ed" stroke-width="2"/><text x="140" y="159" font-size="20" font-weight="700" fill="#1f2937">QKᵀ / √D</text><text x="140" y="188" font-size="14" fill="#52616f">[B, H, T, T]</text><circle cx="285" cy="170" r="28" fill="#fff" stroke="#9b51e0" stroke-width="2"/><text x="285" y="179" font-size="27" font-weight="700" fill="#7e22ce">+</text><rect x="335" y="125" width="190" height="90" rx="10" fill="#fff7e6" stroke="#f2994a" stroke-width="2"/><text x="430" y="159" font-size="20" font-weight="700" fill="#1f2937">Causal Mask M</text><text x="430" y="188" font-size="14" fill="#52616f">未来位置填 -∞</text><rect x="590" y="125" width="170" height="90" rx="10" fill="#f7f3ff" stroke="#9b51e0" stroke-width="2"/><text x="675" y="159" font-size="20" font-weight="700" fill="#1f2937">Softmax</text><text x="675" y="188" font-size="14" fill="#52616f">未来权重变为 0</text><rect x="825" y="125" width="130" height="90" rx="10" fill="#f0fff4" stroke="#27ae60" stroke-width="2"/><text x="890" y="159" font-size="20" font-weight="700" fill="#1f2937">× V</text><text x="890" y="188" font-size="14" fill="#52616f">上下文输出</text>
    <text x="500" y="278" font-size="20" font-weight="700" fill="#1f2937">以 4 个 token 为例</text><text x="395" y="325" font-size="15" fill="#334155">Key →</text><text x="158" y="458" font-size="15" fill="#334155" transform="rotate(-90 158 458)">Query →</text>
    <text x="250" y="355" font-size="14" fill="#334155">春</text><text x="360" y="355" font-size="14" fill="#334155">天</text><text x="470" y="355" font-size="14" fill="#334155">来</text><text x="580" y="355" font-size="14" fill="#334155">了</text><text x="195" y="405" font-size="14" fill="#334155">春</text><text x="195" y="475" font-size="14" fill="#334155">天</text><text x="195" y="545" font-size="14" fill="#334155">来</text><text x="195" y="615" font-size="14" fill="#334155">了</text>
    <rect x="220" y="370" width="60" height="60" fill="#dff5e7"/><text x="250" y="407" font-size="20" fill="#166534">✓</text><rect x="330" y="370" width="60" height="60" fill="#fce8e8"/><text x="360" y="407" font-size="20" fill="#b42318">×</text><rect x="440" y="370" width="60" height="60" fill="#fce8e8"/><text x="470" y="407" font-size="20" fill="#b42318">×</text><rect x="550" y="370" width="60" height="60" fill="#fce8e8"/><text x="580" y="407" font-size="20" fill="#b42318">×</text>
    <rect x="220" y="440" width="60" height="60" fill="#dff5e7"/><text x="250" y="477" font-size="20" fill="#166534">✓</text><rect x="330" y="440" width="60" height="60" fill="#dff5e7"/><text x="360" y="477" font-size="20" fill="#166534">✓</text><rect x="440" y="440" width="60" height="60" fill="#fce8e8"/><text x="470" y="477" font-size="20" fill="#b42318">×</text><rect x="550" y="440" width="60" height="60" fill="#fce8e8"/><text x="580" y="477" font-size="20" fill="#b42318">×</text>
    <rect x="220" y="510" width="60" height="60" fill="#dff5e7"/><text x="250" y="547" font-size="20" fill="#166534">✓</text><rect x="330" y="510" width="60" height="60" fill="#dff5e7"/><text x="360" y="547" font-size="20" fill="#166534">✓</text><rect x="440" y="510" width="60" height="60" fill="#dff5e7"/><text x="470" y="547" font-size="20" fill="#166534">✓</text><rect x="550" y="510" width="60" height="60" fill="#fce8e8"/><text x="580" y="547" font-size="20" fill="#b42318">×</text>
    <rect x="220" y="580" width="60" height="60" fill="#dff5e7"/><text x="250" y="617" font-size="20" fill="#166534">✓</text><rect x="330" y="580" width="60" height="60" fill="#dff5e7"/><text x="360" y="617" font-size="20" fill="#166534">✓</text><rect x="440" y="580" width="60" height="60" fill="#dff5e7"/><text x="470" y="617" font-size="20" fill="#166534">✓</text><rect x="550" y="580" width="60" height="60" fill="#dff5e7"/><text x="580" y="617" font-size="20" fill="#166534">✓</text>
    <rect x="685" y="365" width="260" height="195" rx="11" fill="#fff" stroke="#d4dbe5"/><text x="815" y="403" font-size="18" font-weight="700" fill="#1f2937">第 3 行的含义</text><text x="815" y="443" font-size="16" fill="#334155">“来”可以查看：</text><text x="815" y="476" font-size="17" fill="#166534">春、天、来</text><text x="815" y="516" font-size="16" fill="#334155">但不能查看未来的：</text><text x="815" y="547" font-size="17" fill="#b42318">了</text>
  </g><path d="M525 170H580" stroke="#52616f" stroke-width="3" marker-end="url(#arrow)"/><path d="M760 170H815" stroke="#52616f" stroke-width="3" marker-end="url(#arrow)"/>
</svg>
