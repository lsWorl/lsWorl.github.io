<svg xmlns="http://www.w3.org/2000/svg" width="1150" height="620" viewBox="0 0 1150 620" role="img" aria-labelledby="title desc">
  <title id="title">SFT 在大语言模型训练流程中的位置</title>
  <desc id="desc">从预训练得到 Base Model，经过 SFT 获得指令遵循能力，再可选进行偏好对齐，最后评估部署。</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#52616f"/></marker></defs>
  <rect width="1150" height="620" rx="16" fill="#fbfbfd"/>
  <g font-family="Arial, Microsoft YaHei, sans-serif">
    <text x="575" y="52" text-anchor="middle" font-size="30" font-weight="700" fill="#222831">SFT 位于预训练与偏好对齐之间</text>
    <text x="575" y="84" text-anchor="middle" font-size="16" fill="#5f6b7a">模型架构通常不变，数据分布、Loss 位置和参数值发生变化</text>

    <rect x="55" y="160" width="220" height="180" rx="10" fill="#eaf3ff" stroke="#2f80ed" stroke-width="2"/>
    <text x="165" y="205" text-anchor="middle" font-size="22" font-weight="700" fill="#1f2937">Pretraining</text>
    <text x="165" y="238" text-anchor="middle" font-size="16" fill="#2f5f9e">大规模自然文本</text>
    <text x="165" y="267" text-anchor="middle" font-size="15" fill="#52616f">全序列 next-token loss</text>
    <text x="165" y="303" text-anchor="middle" font-size="17" font-weight="700" fill="#2f5f9e">Base Model</text>

    <path d="M275 250H335" stroke="#52616f" stroke-width="3" marker-end="url(#arrow)"/>

    <rect x="350" y="135" width="240" height="230" rx="10" fill="#fff7e6" stroke="#f2994a" stroke-width="3"/>
    <text x="470" y="185" text-anchor="middle" font-size="25" font-weight="700" fill="#1f2937">SFT</text>
    <text x="470" y="219" text-anchor="middle" font-size="16" fill="#8a5418">指令、回答与对话示范</text>
    <text x="470" y="250" text-anchor="middle" font-size="15" fill="#52616f">Completion / Assistant loss</text>
    <text x="470" y="284" text-anchor="middle" font-size="15" fill="#52616f">Teacher Forcing</text>
    <rect x="390" y="310" width="160" height="37" rx="7" fill="#fff" stroke="#f2c784"/>
    <text x="470" y="335" text-anchor="middle" font-size="16" font-weight="700" fill="#8a5418">SFT Model</text>

    <path d="M590 250H650" stroke="#52616f" stroke-width="3" marker-end="url(#arrow)"/>

    <rect x="665" y="160" width="220" height="180" rx="10" fill="#f4effb" stroke="#9b51e0" stroke-width="2"/>
    <text x="775" y="205" text-anchor="middle" font-size="22" font-weight="700" fill="#1f2937">Preference</text>
    <text x="775" y="238" text-anchor="middle" font-size="16" fill="#6b3fa0">DPO / PPO / GRPO</text>
    <text x="775" y="267" text-anchor="middle" font-size="15" fill="#52616f">偏好、奖励与行为对齐</text>
    <text x="775" y="303" text-anchor="middle" font-size="17" font-weight="700" fill="#6b3fa0">Aligned Model</text>

    <path d="M885 250H945" stroke="#52616f" stroke-width="3" marker-end="url(#arrow)"/>

    <rect x="960" y="160" width="140" height="180" rx="10" fill="#eefaf2" stroke="#27ae60" stroke-width="2"/>
    <text x="1030" y="207" text-anchor="middle" font-size="21" font-weight="700" fill="#1f2937">Deploy</text>
    <text x="1030" y="241" text-anchor="middle" font-size="15" fill="#166534">安全评估</text>
    <text x="1030" y="270" text-anchor="middle" font-size="15" fill="#166534">推理优化</text>
    <text x="1030" y="299" text-anchor="middle" font-size="15" fill="#166534">持续监控</text>

    <rect x="95" y="430" width="960" height="110" rx="10" fill="#fff" stroke="#d4dbe5" stroke-width="2"/>
    <text x="575" y="468" text-anchor="middle" font-size="20" font-weight="700" fill="#334155">同一个 Causal LM 数学主线</text>
    <text x="575" y="503" text-anchor="middle" font-size="17" fill="#52616f">历史 token -&gt; Transformer -&gt; vocab logits -&gt; 提升正确下一个 token 的概率</text>
    <text x="575" y="529" text-anchor="middle" font-size="14" fill="#5f6b7a">阶段差异主要来自数据、标签范围、优化目标和参数更新方式</text>
  </g>
</svg>
