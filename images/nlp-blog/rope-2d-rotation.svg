<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="680" viewBox="0 0 1000 680" role="img" aria-labelledby="title desc">
  <title id="title">二维向量按位置旋转</title>
  <desc id="desc">同一个二维内容向量在位置零、一和二分别旋转零度、九十度和一百八十度，向量长度保持不变。</desc>
  <defs>
    <marker id="axisArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#52616f"/></marker>
    <marker id="blueArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2f80ed"/></marker>
    <marker id="orangeArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#f2994a"/></marker>
    <marker id="greenArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#27ae60"/></marker>
  </defs>
  <rect width="1000" height="680" rx="16" fill="#fbfbfd"/>
  <g font-family="Arial, Microsoft YaHei, sans-serif">
    <text x="500" y="48" text-anchor="middle" font-size="30" font-weight="700" fill="#222831">位置被编码成二维向量的旋转角度</text>
    <text x="500" y="78" text-anchor="middle" font-size="16" fill="#5f6b7a">示意设定：每前进一个 token，旋转 θ = 90°</text>

    <circle cx="400" cy="355" r="205" fill="#fff" stroke="#d4dbe5" stroke-width="2"/>
    <circle cx="400" cy="355" r="4" fill="#334155"/>
    <line x1="150" y1="355" x2="655" y2="355" stroke="#7b8794" stroke-width="2" marker-end="url(#axisArrow)"/>
    <line x1="400" y1="605" x2="400" y2="105" stroke="#7b8794" stroke-width="2" marker-end="url(#axisArrow)"/>
    <text x="668" y="361" font-size="16" fill="#52616f">x₁</text>
    <text x="410" y="115" font-size="16" fill="#52616f">x₂</text>

    <path d="M400 355L598 355" stroke="#2f80ed" stroke-width="5" marker-end="url(#blueArrow)"/>
    <path d="M400 355L400 157" stroke="#f2994a" stroke-width="5" marker-end="url(#orangeArrow)"/>
    <path d="M400 355L202 355" stroke="#27ae60" stroke-width="5" marker-end="url(#greenArrow)"/>

    <path d="M510 355A110 110 0 0 0 400 245" fill="none" stroke="#9b51e0" stroke-width="3" stroke-dasharray="7 6"/>
    <text x="487" y="277" font-size="17" font-weight="700" fill="#7e3fb5">+90°</text>

    <rect x="710" y="130" width="235" height="98" rx="10" fill="#eaf3ff" stroke="#2f80ed" stroke-width="2"/>
    <text x="828" y="164" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2937">位置 0</text>
    <text x="828" y="191" text-anchor="middle" font-size="16" fill="#2f5f9e">R(0°)[1,0]</text>
    <text x="828" y="215" text-anchor="middle" font-size="16" fill="#334155">= [1,0]</text>

    <rect x="710" y="260" width="235" height="98" rx="10" fill="#fff7e6" stroke="#f2994a" stroke-width="2"/>
    <text x="828" y="294" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2937">位置 1</text>
    <text x="828" y="321" text-anchor="middle" font-size="16" fill="#9a5a12">R(90°)[1,0]</text>
    <text x="828" y="345" text-anchor="middle" font-size="16" fill="#334155">= [0,1]</text>

    <rect x="710" y="390" width="235" height="98" rx="10" fill="#eefaf2" stroke="#27ae60" stroke-width="2"/>
    <text x="828" y="424" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2937">位置 2</text>
    <text x="828" y="451" text-anchor="middle" font-size="16" fill="#166534">R(180°)[1,0]</text>
    <text x="828" y="475" text-anchor="middle" font-size="16" fill="#334155">= [-1,0]</text>

    <rect x="695" y="535" width="270" height="82" rx="10" fill="#fff" stroke="#9b51e0" stroke-width="2"/>
    <text x="830" y="568" text-anchor="middle" font-size="17" font-weight="700" fill="#6b3fa0">方向随位置变化</text>
    <text x="830" y="596" text-anchor="middle" font-size="15" fill="#52616f">长度始终保持为 1</text>

    <text x="400" y="645" text-anchor="middle" font-size="16" fill="#334155">同一内容向量 + 不同绝对位置 → 不同相位</text>
  </g>
</svg>
