<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc">
  <title id="title">Mini-GPT自回归生成流程</title><desc id="desc">提示token经过模型获得最后位置logits，经温度和Top-k调整后采样下一个token，拼回输入并循环。</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#52616f"/></marker></defs>
  <rect width="1000" height="620" rx="18" fill="#fbfbfd"/><text x="500" y="52" text-anchor="middle" font-family="Arial, Microsoft YaHei, sans-serif" font-size="30" font-weight="700" fill="#222831">自回归生成：一次只决定一个新 token</text><text x="500" y="84" text-anchor="middle" font-family="Arial, Microsoft YaHei, sans-serif" font-size="16" fill="#5f6b7a">新 token 会成为下一步输入的一部分</text>
  <g font-family="Arial, Microsoft YaHei, sans-serif" text-anchor="middle">
    <rect x="55" y="145" width="190" height="82" rx="10" fill="#eaf3ff" stroke="#2f80ed" stroke-width="2"/><text x="150" y="177" font-size="19" font-weight="700" fill="#1f2937">当前 token 前缀</text><text x="150" y="206" font-size="16" fill="#2f80ed">“春 天”</text>
    <rect x="290" y="145" width="190" height="82" rx="10" fill="#f7f3ff" stroke="#9b51e0" stroke-width="2"/><text x="385" y="177" font-size="19" font-weight="700" fill="#1f2937">Mini-GPT</text><text x="385" y="206" font-size="14" fill="#52616f">截取最近 block_size</text>
    <rect x="525" y="145" width="190" height="82" rx="10" fill="#fff7e6" stroke="#f2994a" stroke-width="2"/><text x="620" y="177" font-size="18" font-weight="700" fill="#1f2937">最后位置 logits</text><text x="620" y="206" font-size="15" fill="#d97706">[B, V]</text>
    <rect x="760" y="145" width="190" height="82" rx="10" fill="#f0fff4" stroke="#27ae60" stroke-width="2"/><text x="855" y="177" font-size="18" font-weight="700" fill="#1f2937">Temperature / Top-k</text><text x="855" y="206" font-size="14" fill="#52616f">调整候选分布</text>
    <rect x="610" y="340" width="240" height="82" rx="10" fill="#eefbf3" stroke="#27ae60" stroke-width="2"/><text x="730" y="372" font-size="19" font-weight="700" fill="#1f2937">Softmax + Multinomial</text><text x="730" y="401" font-size="15" fill="#16803a">采样新 token：“来”</text>
    <rect x="150" y="340" width="340" height="82" rx="10" fill="#eaf3ff" stroke="#2f80ed" stroke-width="2"/><text x="320" y="372" font-size="19" font-weight="700" fill="#1f2937">拼接回输入</text><text x="320" y="401" font-size="16" fill="#2f80ed">“春 天” + “来” → “春 天 来”</text>
    <rect x="190" y="515" width="620" height="52" rx="9" fill="#fff" stroke="#d4dbe5"/><text x="500" y="547" font-size="17" fill="#334155">生成 token t+1 必须等待 token t，因此同一条序列在 token 维度上串行</text>
  </g>
  <path d="M245 186H280" stroke="#52616f" stroke-width="3" marker-end="url(#arrow)"/><path d="M480 186H515" stroke="#52616f" stroke-width="3" marker-end="url(#arrow)"/><path d="M715 186H750" stroke="#52616f" stroke-width="3" marker-end="url(#arrow)"/><path d="M855 227C855 285 765 294 745 330" fill="none" stroke="#52616f" stroke-width="3" marker-end="url(#arrow)"/><path d="M610 381H500" stroke="#52616f" stroke-width="3" marker-end="url(#arrow)"/><path d="M240 340C65 315 65 215 45 190" fill="none" stroke="#9b51e0" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow)"/><text x="85" y="292" font-family="Arial, Microsoft YaHei, sans-serif" font-size="14" fill="#6b21a8">循环</text>
</svg>
