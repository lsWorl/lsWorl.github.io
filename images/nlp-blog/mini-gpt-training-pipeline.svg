<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" role="img" aria-labelledby="title desc">
  <title id="title">Mini-GPT训练流程</title><desc id="desc">语料编码并随机采样窗口，模型前向计算交叉熵，反向传播后进行梯度裁剪和AdamW更新，再重复训练。</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#52616f"/></marker></defs>
  <rect width="1000" height="640" rx="18" fill="#fbfbfd"/><text x="500" y="52" text-anchor="middle" font-family="Arial, Microsoft YaHei, sans-serif" font-size="30" font-weight="700" fill="#222831">Mini-GPT 的一次参数更新</text><text x="500" y="84" text-anchor="middle" font-family="Arial, Microsoft YaHei, sans-serif" font-size="16" fill="#5f6b7a">每一步都重新采样上下文窗口，并用右移目标监督所有位置</text>
  <g font-family="Arial, Microsoft YaHei, sans-serif" text-anchor="middle">
    <rect x="55" y="140" width="200" height="88" rx="10" fill="#eaf3ff" stroke="#2f80ed" stroke-width="2"/><text x="155" y="174" font-size="19" font-weight="700" fill="#1f2937">随机采样窗口</text><text x="155" y="202" font-size="14" fill="#52616f">x [B,T]，y [B,T]</text>
    <rect x="300" y="140" width="200" height="88" rx="10" fill="#f7f3ff" stroke="#9b51e0" stroke-width="2"/><text x="400" y="174" font-size="19" font-weight="700" fill="#1f2937">Forward</text><text x="400" y="202" font-size="14" fill="#52616f">logits [B,T,V]</text>
    <rect x="545" y="140" width="200" height="88" rx="10" fill="#fff7e6" stroke="#f2994a" stroke-width="2"/><text x="645" y="174" font-size="19" font-weight="700" fill="#1f2937">Cross Entropy</text><text x="645" y="202" font-size="14" fill="#52616f">得到标量 loss</text>
    <rect x="790" y="140" width="160" height="88" rx="10" fill="#f0fff4" stroke="#27ae60" stroke-width="2"/><text x="870" y="174" font-size="19" font-weight="700" fill="#1f2937">zero_grad</text><text x="870" y="202" font-size="14" fill="#52616f">清除旧梯度</text>
    <rect x="790" y="350" width="160" height="88" rx="10" fill="#eaf3ff" stroke="#2f80ed" stroke-width="2"/><text x="870" y="384" font-size="19" font-weight="700" fill="#1f2937">Backward</text><text x="870" y="412" font-size="14" fill="#52616f">计算所有参数梯度</text>
    <rect x="545" y="350" width="200" height="88" rx="10" fill="#fff7e6" stroke="#f2994a" stroke-width="2"/><text x="645" y="384" font-size="19" font-weight="700" fill="#1f2937">Gradient Clipping</text><text x="645" y="412" font-size="14" fill="#52616f">限制总范数为 1.0</text>
    <rect x="300" y="350" width="200" height="88" rx="10" fill="#f0fff4" stroke="#27ae60" stroke-width="2"/><text x="400" y="384" font-size="19" font-weight="700" fill="#1f2937">AdamW Step</text><text x="400" y="412" font-size="14" fill="#52616f">更新参数与优化器状态</text>
    <rect x="55" y="350" width="200" height="88" rx="10" fill="#f7f3ff" stroke="#9b51e0" stroke-width="2"/><text x="155" y="384" font-size="19" font-weight="700" fill="#1f2937">更新学习率</text><text x="155" y="412" font-size="14" fill="#52616f">warmup + cosine</text>
    <rect x="180" y="525" width="640" height="60" rx="10" fill="#fff" stroke="#d4dbe5"/><text x="500" y="551" font-size="18" font-weight="700" fill="#1f2937">重复直到 max_steps</text><text x="500" y="575" font-size="14" fill="#52616f">定期切换 model.eval() 评估训练集与验证集</text>
  </g>
  <path d="M255 184H290" stroke="#52616f" stroke-width="3" marker-end="url(#arrow)"/><path d="M500 184H535" stroke="#52616f" stroke-width="3" marker-end="url(#arrow)"/><path d="M745 184H780" stroke="#52616f" stroke-width="3" marker-end="url(#arrow)"/><path d="M870 228V340" stroke="#52616f" stroke-width="3" marker-end="url(#arrow)"/><path d="M790 394H755" stroke="#52616f" stroke-width="3" marker-end="url(#arrow)"/><path d="M545 394H510" stroke="#52616f" stroke-width="3" marker-end="url(#arrow)"/><path d="M300 394H265" stroke="#52616f" stroke-width="3" marker-end="url(#arrow)"/><path d="M155 438C155 495 350 490 400 515" fill="none" stroke="#52616f" stroke-width="3" marker-end="url(#arrow)"/><path d="M600 525C945 500 965 285 940 238" fill="none" stroke="#9b51e0" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#arrow)"/>
</svg>
