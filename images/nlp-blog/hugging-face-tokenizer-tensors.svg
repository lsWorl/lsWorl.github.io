<svg xmlns="http://www.w3.org/2000/svg" width="1150" height="700" viewBox="0 0 1150 700" role="img" aria-labelledby="title desc">
  <title id="title">Tokenizer 输出张量</title>
  <desc id="desc">两个不同长度的中文句子经过切分、加入特殊 token 和动态填充后，形成 input_ids 与 attention_mask 矩阵。</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#52616f"/></marker></defs>
  <rect width="1150" height="700" rx="16" fill="#fbfbfd"/>
  <g font-family="Arial, Microsoft YaHei, sans-serif">
    <text x="575" y="50" text-anchor="middle" font-size="30" font-weight="700" fill="#222831">Tokenizer 如何把不同长度文本变成一个 Batch</text>
    <text x="575" y="81" text-anchor="middle" font-size="16" fill="#5f6b7a">示意 token id 仅用于解释，不代表具体词表编号</text>

    <rect x="55" y="125" width="265" height="145" rx="10" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="187" y="160" text-anchor="middle" font-size="19" font-weight="700" fill="#334155">原始文本</text>
    <rect x="82" y="181" width="210" height="32" rx="5" fill="#eaf3ff"/><text x="187" y="203" text-anchor="middle" font-size="15" fill="#2f5f9e">“很好用”</text>
    <rect x="82" y="222" width="210" height="32" rx="5" fill="#fff7e6"/><text x="187" y="244" text-anchor="middle" font-size="15" fill="#8a5418">“质量非常糟糕”</text>

    <path d="M320 198H370" stroke="#52616f" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="385" y="120" width="310" height="155" rx="10" fill="#f4effb" stroke="#9b51e0" stroke-width="2"/>
    <text x="540" y="154" text-anchor="middle" font-size="20" font-weight="700" fill="#1f2937">切分 + 特殊 Token</text>
    <text x="540" y="190" text-anchor="middle" font-size="15" fill="#6b3fa0">[CLS] 很 好 用 [SEP]</text>
    <text x="540" y="223" text-anchor="middle" font-size="15" fill="#6b3fa0">[CLS] 质 量 非 常 糟 糕 [SEP]</text>
    <text x="540" y="253" text-anchor="middle" font-size="14" fill="#52616f">短序列 5 token，长序列 8 token</text>

    <path d="M695 198H745" stroke="#52616f" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="760" y="120" width="335" height="155" rx="10" fill="#fff7e6" stroke="#f2994a" stroke-width="2"/>
    <text x="927" y="154" text-anchor="middle" font-size="20" font-weight="700" fill="#1f2937">动态 Padding 到 8</text>
    <text x="927" y="190" text-anchor="middle" font-size="14" fill="#8a5418">[CLS] 很 好 用 [SEP] [PAD] [PAD] [PAD]</text>
    <text x="927" y="223" text-anchor="middle" font-size="14" fill="#8a5418">[CLS] 质 量 非 常 糟 糕 [SEP]</text>
    <text x="927" y="253" text-anchor="middle" font-size="14" fill="#52616f">只补当前 batch 所需长度</text>

    <rect x="70" y="340" width="465" height="235" rx="10" fill="#eaf3ff" stroke="#2f80ed" stroke-width="2"/>
    <text x="302" y="378" text-anchor="middle" font-size="21" font-weight="700" fill="#1f2937">input_ids [2, 8]</text>
    <text x="302" y="410" text-anchor="middle" font-size="14" fill="#52616f">每个 token 查词表后的整数编号</text>
    <g text-anchor="middle" font-size="15" fill="#334155">
      <rect x="100" y="440" width="405" height="45" rx="6" fill="#fff" stroke="#9bbce8"/><text x="302" y="468">101  1962  1962  4500  102  0  0  0</text>
      <rect x="100" y="500" width="405" height="45" rx="6" fill="#fff" stroke="#9bbce8"/><text x="302" y="528">101  6574  7030  7478  2382  5136  5136  102</text>
    </g>

    <rect x="615" y="340" width="465" height="235" rx="10" fill="#eefaf2" stroke="#27ae60" stroke-width="2"/>
    <text x="847" y="378" text-anchor="middle" font-size="21" font-weight="700" fill="#1f2937">attention_mask [2, 8]</text>
    <text x="847" y="410" text-anchor="middle" font-size="14" fill="#52616f">1 为有效 token，0 为 Padding</text>
    <g text-anchor="middle" font-size="15" fill="#334155">
      <rect x="645" y="440" width="405" height="45" rx="6" fill="#fff" stroke="#9fd3ad"/><text x="847" y="468">1  1  1  1  1  0  0  0</text>
      <rect x="645" y="500" width="405" height="45" rx="6" fill="#fff" stroke="#9fd3ad"/><text x="847" y="528">1  1  1  1  1  1  1  1</text>
    </g>

    <rect x="170" y="615" width="810" height="46" rx="8" fill="#fff" stroke="#d4dbe5"/>
    <text x="575" y="644" text-anchor="middle" font-size="16" fill="#334155">Token id 表示“是什么”，attention mask 表示“哪些位置有效”</text>
  </g>
</svg>
