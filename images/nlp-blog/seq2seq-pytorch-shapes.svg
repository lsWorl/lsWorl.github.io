<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="580" viewBox="0 0 1000 580" role="img" aria-labelledby="title desc">
  <title id="title">PyTorch Seq2Seq张量形状</title>
  <desc id="desc">展示源token、Embedding、GRU输出、隐藏状态和Decoder logits的主要张量形状。</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#52616f"/></marker></defs>
  <rect width="1000" height="580" rx="18" fill="#fbfbfd"/>
  <text x="500" y="54" text-anchor="middle" font-family="Arial, Microsoft YaHei, sans-serif" font-size="30" font-weight="700" fill="#222831">PyTorch Seq2Seq 的主要张量形状</text>
  <text x="500" y="88" text-anchor="middle" font-family="Arial, Microsoft YaHei, sans-serif" font-size="16" fill="#5f6b7a">以下使用 batch_first=True，B=batch，S=序列长度</text>

  <g font-family="Arial, Microsoft YaHei, sans-serif" text-anchor="middle">
    <rect x="45" y="180" width="150" height="95" rx="10" fill="#eaf3ff" stroke="#2f80ed" stroke-width="2"/><text x="120" y="215" font-size="19" font-weight="700" fill="#222831">src ids</text><text x="120" y="247" font-size="16" fill="#334155">[B, S]</text>
    <rect x="245" y="180" width="170" height="95" rx="10" fill="#fff8e8" stroke="#f2994a" stroke-width="2"/><text x="330" y="215" font-size="19" font-weight="700" fill="#222831">Embedding</text><text x="330" y="247" font-size="16" fill="#334155">[B, S, E]</text>
    <rect x="465" y="160" width="190" height="135" rx="10" fill="#f0fff4" stroke="#27ae60" stroke-width="2"/><text x="560" y="198" font-size="20" font-weight="700" fill="#222831">Encoder GRU</text><text x="560" y="232" font-size="15" fill="#334155">outputs [B,S,H]</text><text x="560" y="263" font-size="15" fill="#334155">hidden [L,B,H]</text>
    <rect x="735" y="180" width="210" height="95" rx="10" fill="#f7f3ff" stroke="#9b51e0" stroke-width="2"/><text x="840" y="215" font-size="19" font-weight="700" fill="#222831">Decoder 初始状态</text><text x="840" y="247" font-size="16" fill="#334155">hidden [L,B,H]</text>

    <rect x="200" y="385" width="190" height="95" rx="10" fill="#eaf3ff" stroke="#2f80ed" stroke-width="2"/><text x="295" y="420" font-size="19" font-weight="700" fill="#222831">单步 token</text><text x="295" y="452" font-size="16" fill="#334155">[B] -> [B,1,E]</text>
    <rect x="470" y="385" width="190" height="95" rx="10" fill="#f0fff4" stroke="#27ae60" stroke-width="2"/><text x="565" y="420" font-size="19" font-weight="700" fill="#222831">Decoder GRU</text><text x="565" y="452" font-size="16" fill="#334155">[B,1,H]</text>
    <rect x="740" y="385" width="190" height="95" rx="10" fill="#fff0f0" stroke="#eb5757" stroke-width="2"/><text x="835" y="420" font-size="19" font-weight="700" fill="#222831">词表 logits</text><text x="835" y="452" font-size="16" fill="#334155">[B,V]</text>
  </g>

  <path d="M195 227H234M415 227H454M655 227H724M390 432H459M660 432H729" stroke="#52616f" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M840 275C840 330 565 325 565 374" fill="none" stroke="#9b51e0" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="500" y="535" text-anchor="middle" font-family="Arial, Microsoft YaHei, sans-serif" font-size="15" fill="#5f6b7a">L=num_layers，E=embed_dim，H=hidden_dim，V=vocab_size</text>
</svg>
