<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc">
  <title id="title">PyTorch 构造神经网络的三个抽象层次</title>
  <desc id="desc">从手动创建 Tensor 参数，过渡到 nn.Linear 管理单层参数，再到 nn.Module 管理整个网络。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#52616f"/>
    </marker>
  </defs>
  <rect width="1000" height="560" rx="18" fill="#fbfbfd"/>
  <text x="500" y="54" text-anchor="middle" font-family="Arial, Microsoft YaHei, sans-serif" font-size="30" font-weight="700" fill="#222831">PyTorch 构造神经网络的渐进过程</text>
  <text x="500" y="88" text-anchor="middle" font-family="Arial, Microsoft YaHei, sans-serif" font-size="16" fill="#5f6b7a">数学计算不变，参数和模型管理逐步自动化</text>

  <g font-family="Arial, Microsoft YaHei, sans-serif" text-anchor="middle">
    <rect x="55" y="155" width="250" height="230" rx="12" fill="#eaf3ff" stroke="#2f80ed" stroke-width="2"/>
    <text x="180" y="197" font-size="22" font-weight="700" fill="#222831">1. 手动 Tensor</text>
    <text x="180" y="235" font-size="16" fill="#334155">W1、b1、W2、b2</text>
    <text x="180" y="270" font-size="15" fill="#5f6b7a">自己创建参数</text>
    <text x="180" y="299" font-size="15" fill="#5f6b7a">自己写矩阵运算</text>
    <text x="180" y="328" font-size="15" fill="#5f6b7a">手动交给优化器</text>
    <rect x="95" y="342" width="170" height="30" rx="7" fill="#ffffff" stroke="#b9d3f5"/>
    <text x="180" y="363" font-size="13" fill="#334155">SGD([W1, b1, W2, b2])</text>

    <rect x="375" y="155" width="250" height="230" rx="12" fill="#fff8e8" stroke="#f2994a" stroke-width="2"/>
    <text x="500" y="197" font-size="22" font-weight="700" fill="#222831">2. nn.Linear</text>
    <text x="500" y="235" font-size="16" fill="#334155">linear1、linear2</text>
    <text x="500" y="270" font-size="15" fill="#5f6b7a">每层自动创建参数</text>
    <text x="500" y="299" font-size="15" fill="#5f6b7a">自动选择默认初始化</text>
    <text x="500" y="328" font-size="15" fill="#5f6b7a">仍需手动收集多层参数</text>
    <rect x="415" y="342" width="170" height="30" rx="7" fill="#ffffff" stroke="#efd3a9"/>
    <text x="500" y="363" font-size="13" fill="#334155">linear1(X) -> linear2(h)</text>

    <rect x="695" y="155" width="250" height="230" rx="12" fill="#f0fff4" stroke="#27ae60" stroke-width="2"/>
    <text x="820" y="197" font-size="22" font-weight="700" fill="#222831">3. nn.Module</text>
    <text x="820" y="235" font-size="16" fill="#334155">model = XORNet()</text>
    <text x="820" y="270" font-size="15" fill="#5f6b7a">递归管理所有子层</text>
    <text x="820" y="299" font-size="15" fill="#5f6b7a">forward 定义前向传播</text>
    <text x="820" y="328" font-size="15" fill="#5f6b7a">统一保存、迁移和切换模式</text>
    <rect x="735" y="342" width="170" height="30" rx="7" fill="#ffffff" stroke="#b9ddc4"/>
    <text x="820" y="363" font-size="13" fill="#334155">SGD(model.parameters())</text>
  </g>

  <path d="M305 270 H363" stroke="#52616f" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M625 270 H683" stroke="#52616f" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="340" y="250" text-anchor="middle" font-family="Arial, Microsoft YaHei, sans-serif" font-size="14" fill="#52616f">封装单层</text>
  <text x="660" y="250" text-anchor="middle" font-family="Arial, Microsoft YaHei, sans-serif" font-size="14" fill="#52616f">组织整体</text>

  <rect x="190" y="440" width="620" height="54" rx="10" fill="#ffffff" stroke="#d4dbe5"/>
  <text x="500" y="473" text-anchor="middle" font-family="Arial, Microsoft YaHei, sans-serif" font-size="17" fill="#222831">三个版本都遵循：前向传播 -> loss.backward() -> optimizer.step()</text>
</svg>
