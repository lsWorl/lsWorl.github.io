<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" role="img" aria-labelledby="title desc">
  <title id="title">MLP 单层前向计算</title>
  <desc id="desc">一层 MLP 先做线性变换，再通过激活函数得到输出。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#566070"/>
    </marker>
  </defs>
  <rect width="1000" height="500" rx="18" fill="#fbfbfd"/>
  <text x="500" y="54" text-anchor="middle" font-family="Arial, Microsoft YaHei, sans-serif" font-size="30" font-weight="700" fill="#222831">一层 MLP：Linear + Activation</text>
  <text x="500" y="88" text-anchor="middle" font-family="Arial, Microsoft YaHei, sans-serif" font-size="16" fill="#5f6b7a">没有激活函数时，多层线性变换仍然等价于一层线性变换</text>
  <g font-family="Arial, Microsoft YaHei, sans-serif" text-anchor="middle">
    <rect x="70" y="190" width="130" height="78" rx="10" fill="#eaf3ff" stroke="#2f80ed" stroke-width="2"/>
    <text x="135" y="238" font-size="23" font-weight="700" fill="#222831">输入 x</text>
    <rect x="285" y="178" width="190" height="102" rx="10" fill="#fff8e8" stroke="#f2994a" stroke-width="2"/>
    <text x="380" y="216" font-size="22" font-weight="700" fill="#222831">线性变换</text>
    <text x="380" y="246" font-size="19" fill="#222831">z = xW + b</text>
    <rect x="560" y="178" width="190" height="102" rx="10" fill="#f0fff4" stroke="#27ae60" stroke-width="2"/>
    <text x="655" y="216" font-size="22" font-weight="700" fill="#222831">激活函数</text>
    <text x="655" y="246" font-size="19" fill="#222831">a = σ(z)</text>
    <rect x="835" y="190" width="120" height="78" rx="10" fill="#f7f3ff" stroke="#9b51e0" stroke-width="2"/>
    <text x="895" y="238" font-size="23" font-weight="700" fill="#222831">输出 a</text>
  </g>
  <path d="M200 229 H274" stroke="#566070" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M475 229 H549" stroke="#566070" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M750 229 H824" stroke="#566070" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="246" y="360" width="508" height="48" rx="10" fill="#ffffff" stroke="#d4dbe5"/>
  <text x="500" y="391" text-anchor="middle" font-family="Arial, Microsoft YaHei, sans-serif" font-size="17" fill="#222831">PyTorch 常见写法：nn.Linear -> nn.ReLU / nn.GELU -> nn.Linear</text>
</svg>
