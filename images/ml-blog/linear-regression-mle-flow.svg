<svg xmlns="http://www.w3.org/2000/svg" width="960" height="330" viewBox="0 0 960 330" role="img" aria-labelledby="title desc">
  <title id="title">最小二乘的极大似然解释</title>
  <desc id="desc">线性均值加高斯噪声得到条件概率，联合似然取负对数后成为平方误差和。</desc>
  <defs>
    <style>
      .text { font-family: Arial, "Microsoft YaHei", sans-serif; fill: #253247; font-size: 16px; }
      .heading { font-size: 22px; font-weight: 700; }
      .small { font-size: 14px; fill: #536174; }
      .formula { font-family: "Times New Roman", serif; font-size: 18px; fill: #253247; }
      .box { fill: #ffffff; stroke: #cfd8e3; stroke-width: 2; }
      .arrow { stroke: #68788e; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#68788e"/></marker>
  </defs>
  <rect width="960" height="330" fill="#f7f9fc"/>
  <text class="text heading" x="36" y="42">高斯噪声假设把概率问题变成最小二乘</text>
  <text class="text small" x="36" y="68">最大化“观测到这些数据的可能性”，等价于最小化残差平方和。</text>

  <rect class="box" x="34" y="112" width="190" height="138" rx="8"/>
  <text class="text" x="58" y="145" font-weight="700">生成假设</text>
  <text class="formula" x="58" y="184">t = wᵀφ(x) + ε</text>
  <text class="formula" x="58" y="218">ε ~ N(0, β⁻¹)</text>

  <path class="arrow" d="M234 181 L280 181"/>
  <rect class="box" x="292" y="112" width="190" height="138" rx="8"/>
  <text class="text" x="316" y="145" font-weight="700">条件概率</text>
  <text class="formula" x="316" y="186">p(t | x, w, β)</text>
  <text class="formula" x="316" y="218">= N(t | wᵀφ, β⁻¹)</text>

  <path class="arrow" d="M492 181 L538 181"/>
  <rect class="box" x="550" y="112" width="160" height="138" rx="8"/>
  <text class="text" x="574" y="145" font-weight="700">负对数</text>
  <text class="formula" x="574" y="190">-log ∏ p(tₙ)</text>
  <text class="text small" x="574" y="222">乘法变加法</text>

  <path class="arrow" d="M720 181 L766 181"/>
  <rect x="778" y="102" width="150" height="158" rx="8" fill="#fff4df" stroke="#c78328" stroke-width="2.5"/>
  <text class="text" x="800" y="139" font-weight="700">平方误差</text>
  <text class="formula" x="799" y="185">Σ(tₙ - ŷₙ)²</text>
  <text class="text small" x="800" y="220">最小化 SSE</text>
  <text class="text small" x="278" y="298">假设变了，合适的损失也会变；平方误差对应的是独立同方差高斯噪声。</text>
</svg>
