<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc">
  <title id="title">Adam 与 SGD、Momentum、RMSProp 的关系</title>
  <desc id="desc">Momentum 平滑梯度方向，RMSProp 根据梯度平方调整尺度，Adam 同时使用两种信息。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#52616f"/>
    </marker>
  </defs>
  <rect width="1000" height="560" rx="18" fill="#fbfbfd"/>
  <text x="500" y="54" text-anchor="middle" font-family="Arial, Microsoft YaHei, sans-serif" font-size="30" font-weight="700" fill="#222831">Adam 组合了哪两类思想</text>
  <text x="500" y="88" text-anchor="middle" font-family="Arial, Microsoft YaHei, sans-serif" font-size="16" fill="#5f6b7a">方向平滑与尺度缩放共同决定每次参数更新</text>

  <g font-family="Arial, Microsoft YaHei, sans-serif" text-anchor="middle">
    <rect x="80" y="130" width="240" height="155" rx="12" fill="#fff8e8" stroke="#f2994a" stroke-width="2"/>
    <text x="200" y="173" font-size="23" font-weight="700" fill="#222831">Momentum 思想</text>
    <text x="200" y="212" font-size="17" fill="#334155">一阶矩 m<tspan baseline-shift="sub" font-size="12">t</tspan></text>
    <text x="200" y="244" font-size="15" fill="#5f6b7a">减少梯度噪声与来回震荡</text>
    <text x="200" y="268" font-size="15" fill="#5f6b7a">保留近期一致的前进方向</text>

    <rect x="80" y="335" width="240" height="155" rx="12" fill="#f0fff4" stroke="#27ae60" stroke-width="2"/>
    <text x="200" y="378" font-size="23" font-weight="700" fill="#222831">RMSProp 思想</text>
    <text x="200" y="417" font-size="17" fill="#334155">二阶矩 v<tspan baseline-shift="sub" font-size="12">t</tspan></text>
    <text x="200" y="449" font-size="15" fill="#5f6b7a">按历史梯度平方调整尺度</text>
    <text x="200" y="473" font-size="15" fill="#5f6b7a">不同参数获得不同有效步长</text>

    <rect x="600" y="202" width="310" height="215" rx="14" fill="#f7f3ff" stroke="#9b51e0" stroke-width="3"/>
    <text x="755" y="254" font-size="28" font-weight="700" fill="#222831">Adam</text>
    <text x="755" y="297" font-size="18" fill="#334155">平滑方向 ÷ 梯度尺度</text>
    <text x="755" y="335" font-size="17" fill="#5f6b7a">m̂<tspan baseline-shift="sub" font-size="12">t</tspan> / (√v̂<tspan baseline-shift="sub" font-size="12">t</tspan> + ε)</text>
    <text x="755" y="374" font-size="15" fill="#5f6b7a">再乘基础学习率 α</text>
  </g>

  <path d="M320 208 C450 208 505 270 589 285" fill="none" stroke="#52616f" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M320 412 C450 412 505 350 589 335" fill="none" stroke="#52616f" stroke-width="3" marker-end="url(#arrow)"/>
</svg>
