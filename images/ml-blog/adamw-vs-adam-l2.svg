<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="590" viewBox="0 0 1000 590" role="img" aria-labelledby="title desc">
  <title id="title">Adam 加 L2 与 AdamW 对比</title>
  <desc id="desc">Adam 加 L2 会让正则项进入矩估计，AdamW 则将权重衰减独立作用于参数。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#52616f"/>
    </marker>
  </defs>
  <rect width="1000" height="590" rx="18" fill="#fbfbfd"/>
  <text x="500" y="54" text-anchor="middle" font-family="Arial, Microsoft YaHei, sans-serif" font-size="30" font-weight="700" fill="#222831">Adam + L2 与 AdamW 的核心区别</text>
  <text x="500" y="88" text-anchor="middle" font-family="Arial, Microsoft YaHei, sans-serif" font-size="16" fill="#5f6b7a">区别不在于是否限制权重，而在于正则项是否进入自适应梯度统计</text>

  <line x1="500" y1="120" x2="500" y2="525" stroke="#d4dbe5" stroke-width="2"/>

  <g font-family="Arial, Microsoft YaHei, sans-serif" text-anchor="middle">
    <text x="260" y="150" font-size="25" font-weight="700" fill="#b45309">Adam + L2</text>
    <rect x="90" y="185" width="340" height="72" rx="10" fill="#fff8e8" stroke="#f2994a" stroke-width="2"/>
    <text x="260" y="229" font-size="19" fill="#334155">g' = g + λθ</text>
    <rect x="90" y="315" width="340" height="95" rx="10" fill="#fff0f0" stroke="#eb5757" stroke-width="2"/>
    <text x="260" y="352" font-size="19" font-weight="700" fill="#222831">g' 进入 m 和 v</text>
    <text x="260" y="382" font-size="15" fill="#5f6b7a">衰减项受到 Adam 自适应缩放</text>
    <rect x="115" y="465" width="290" height="52" rx="9" fill="#ffffff" stroke="#d4dbe5"/>
    <text x="260" y="497" font-size="16" fill="#334155">有效衰减随参数历史梯度变化</text>

    <text x="740" y="150" font-size="25" font-weight="700" fill="#15803d">AdamW</text>
    <rect x="570" y="185" width="340" height="72" rx="10" fill="#eaf3ff" stroke="#2f80ed" stroke-width="2"/>
    <text x="740" y="229" font-size="19" fill="#334155">m、v 只使用数据梯度 g</text>
    <rect x="570" y="315" width="340" height="95" rx="10" fill="#f0fff4" stroke="#27ae60" stroke-width="2"/>
    <text x="740" y="352" font-size="19" font-weight="700" fill="#222831">单独执行 αλθ</text>
    <text x="740" y="382" font-size="15" fill="#5f6b7a">权重衰减不进入矩估计</text>
    <rect x="595" y="465" width="290" height="52" rx="9" fill="#ffffff" stroke="#d4dbe5"/>
    <text x="740" y="497" font-size="16" fill="#334155">衰减路径更直接、更容易控制</text>
  </g>

  <path d="M260 257 V304" stroke="#52616f" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M260 410 V454" stroke="#52616f" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M740 257 V304" stroke="#52616f" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M740 410 V454" stroke="#52616f" stroke-width="3" marker-end="url(#arrow)"/>
</svg>
