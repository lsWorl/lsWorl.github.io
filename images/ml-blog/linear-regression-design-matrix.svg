<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img" aria-labelledby="title desc">
  <title id="title">从样本到设计矩阵再到批量预测</title>
  <desc id="desc">多个样本按行组成设计矩阵，设计矩阵乘参数向量后一次得到所有样本的预测。</desc>
  <defs>
    <style>
      .text { font-family: Arial, "Microsoft YaHei", sans-serif; fill: #253247; font-size: 16px; }
      .heading { font-size: 22px; font-weight: 700; }
      .small { font-size: 14px; fill: #536174; }
      .formula { font-family: Consolas, "Microsoft YaHei", monospace; font-size: 17px; fill: #253247; }
      .box { fill: #ffffff; stroke: #cfd8e3; stroke-width: 2; }
      .arrow { stroke: #68788e; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#68788e"/></marker>
  </defs>
  <rect width="960" height="400" fill="#f7f9fc"/>
  <text class="text heading" x="36" y="42">矩阵写法只是把多个样本一起计算</text>
  <text class="text small" x="36" y="68">第一列恒为 1，用来吸收偏置 b；每一行对应一个训练样本。</text>

  <rect class="box" x="42" y="108" width="218" height="218" rx="8"/>
  <text class="text" x="68" y="142" font-weight="700">三个样本</text>
  <circle cx="74" cy="184" r="7" fill="#3979b8"/><text class="formula" x="94" y="190">x=0, y=1</text>
  <circle cx="74" cy="226" r="7" fill="#2f8a62"/><text class="formula" x="94" y="232">x=1, y=3</text>
  <circle cx="74" cy="268" r="7" fill="#c78328"/><text class="formula" x="94" y="274">x=2, y=5</text>
  <text class="text small" x="68" y="306">给每个 x 前面补一个 1</text>

  <path class="arrow" d="M270 218 L322 218"/>

  <rect class="box" x="334" y="98" width="242" height="238" rx="8"/>
  <text class="text" x="360" y="132" font-weight="700">设计矩阵 X</text>
  <rect x="370" y="158" width="164" height="118" fill="#edf5ff" stroke="#9bbcdf"/>
  <text class="formula" x="398" y="190">[ 1  0 ]</text>
  <text class="formula" x="398" y="224">[ 1  1 ]</text>
  <text class="formula" x="398" y="258">[ 1  2 ]</text>
  <text class="text small" x="371" y="306">形状：3 × 2</text>

  <text class="formula" x="600" y="224">×</text>
  <rect class="box" x="634" y="135" width="106" height="164" rx="8"/>
  <text class="text" x="662" y="166" font-weight="700">θ</text>
  <text class="formula" x="658" y="211">[ 1 ]</text>
  <text class="formula" x="658" y="250">[ 2 ]</text>
  <text class="text small" x="650" y="282">b, w</text>

  <path class="arrow" d="M750 218 L792 218"/>
  <rect class="box" x="804" y="120" width="116" height="196" rx="8"/>
  <text class="text" x="826" y="154" font-weight="700">预测 ŷ</text>
  <text class="formula" x="832" y="201">[ 1 ]</text>
  <text class="formula" x="832" y="238">[ 3 ]</text>
  <text class="formula" x="832" y="275">[ 5 ]</text>
  <text class="text small" x="350" y="374">Xθ = ŷ：一次矩阵乘法得到全部样本的预测</text>
</svg>
