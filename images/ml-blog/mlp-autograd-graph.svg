<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" role="img" aria-labelledby="title desc">
  <title id="title">Autograd 动态计算图</title>
  <desc id="desc">Autograd 在前向传播时记录张量操作，在反向传播时用链式法则计算梯度。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#566070"/>
    </marker>
    <marker id="redArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#eb5757"/>
    </marker>
  </defs>
  <rect width="1000" height="520" rx="18" fill="#fbfbfd"/>
  <text x="500" y="54" text-anchor="middle" font-family="Arial, Microsoft YaHei, sans-serif" font-size="30" font-weight="700" fill="#222831">Autograd：前向记录，反向求梯度</text>
  <text x="500" y="88" text-anchor="middle" font-family="Arial, Microsoft YaHei, sans-serif" font-size="16" fill="#5f6b7a">计算图是在张量流过模型时动态构建的</text>
  <g font-family="Arial, Microsoft YaHei, sans-serif" text-anchor="middle">
    <rect x="90" y="205" width="120" height="72" rx="10" fill="#eaf3ff" stroke="#2f80ed" stroke-width="2"/>
    <text x="150" y="249" font-size="20" font-weight="700" fill="#222831">输入 x</text>
    <rect x="290" y="205" width="130" height="72" rx="10" fill="#fff8e8" stroke="#f2994a" stroke-width="2"/>
    <text x="355" y="249" font-size="20" font-weight="700" fill="#222831">Linear</text>
    <rect x="500" y="205" width="130" height="72" rx="10" fill="#f0fff4" stroke="#27ae60" stroke-width="2"/>
    <text x="565" y="249" font-size="20" font-weight="700" fill="#222831">ReLU/GELU</text>
    <rect x="710" y="205" width="130" height="72" rx="10" fill="#f7f3ff" stroke="#9b51e0" stroke-width="2"/>
    <text x="775" y="249" font-size="20" font-weight="700" fill="#222831">Loss</text>
  </g>
  <path d="M210 241 H279" stroke="#566070" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M420 241 H489" stroke="#566070" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M630 241 H699" stroke="#566070" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M775 277 C740 360 395 360 355 278" stroke="#eb5757" stroke-width="3" fill="none" marker-end="url(#redArrow)"/>
  <text x="565" y="376" text-anchor="middle" font-family="Arial, Microsoft YaHei, sans-serif" font-size="17" font-weight="700" fill="#c0392b">loss.backward()：按链式法则回传梯度</text>
  <rect x="210" y="420" width="580" height="46" rx="10" fill="#ffffff" stroke="#d4dbe5"/>
  <text x="500" y="449" text-anchor="middle" font-family="Arial, Microsoft YaHei, sans-serif" font-size="16" fill="#222831">参数的 .grad 被填充后，optimizer.step() 才能更新参数</text>
</svg>
