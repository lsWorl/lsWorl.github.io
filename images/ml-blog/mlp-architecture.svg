<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc">
  <title id="title">MLP 网络结构</title>
  <desc id="desc">多层感知机把输入特征经过隐藏层变换为输出预测。</desc>
  <rect width="1000" height="560" rx="18" fill="#fbfbfd"/>
  <text x="500" y="54" text-anchor="middle" font-family="Arial, Microsoft YaHei, sans-serif" font-size="30" font-weight="700" fill="#222831">MLP：输入层 -> 隐藏层 -> 输出层</text>
  <text x="500" y="88" text-anchor="middle" font-family="Arial, Microsoft YaHei, sans-serif" font-size="16" fill="#5f6b7a">每个全连接层学习一次线性变换，激活函数提供非线性表达能力</text>
  <g stroke="#c8d0da" stroke-width="2">
    <line x1="160" y1="185" x2="360" y2="155"/><line x1="160" y1="185" x2="360" y2="245"/><line x1="160" y1="185" x2="360" y2="335"/>
    <line x1="160" y1="275" x2="360" y2="155"/><line x1="160" y1="275" x2="360" y2="245"/><line x1="160" y1="275" x2="360" y2="335"/>
    <line x1="160" y1="365" x2="360" y2="155"/><line x1="160" y1="365" x2="360" y2="245"/><line x1="160" y1="365" x2="360" y2="335"/>
    <line x1="360" y1="155" x2="590" y2="185"/><line x1="360" y1="155" x2="590" y2="275"/><line x1="360" y1="155" x2="590" y2="365"/>
    <line x1="360" y1="245" x2="590" y2="185"/><line x1="360" y1="245" x2="590" y2="275"/><line x1="360" y1="245" x2="590" y2="365"/>
    <line x1="360" y1="335" x2="590" y2="185"/><line x1="360" y1="335" x2="590" y2="275"/><line x1="360" y1="335" x2="590" y2="365"/>
    <line x1="590" y1="185" x2="800" y2="230"/><line x1="590" y1="185" x2="800" y2="320"/>
    <line x1="590" y1="275" x2="800" y2="230"/><line x1="590" y1="275" x2="800" y2="320"/>
    <line x1="590" y1="365" x2="800" y2="230"/><line x1="590" y1="365" x2="800" y2="320"/>
  </g>
  <g font-family="Arial, Microsoft YaHei, sans-serif" text-anchor="middle">
    <circle cx="160" cy="185" r="28" fill="#eaf3ff" stroke="#2f80ed" stroke-width="3"/><text x="160" y="192" font-size="16" fill="#222831">x1</text>
    <circle cx="160" cy="275" r="28" fill="#eaf3ff" stroke="#2f80ed" stroke-width="3"/><text x="160" y="282" font-size="16" fill="#222831">x2</text>
    <circle cx="160" cy="365" r="28" fill="#eaf3ff" stroke="#2f80ed" stroke-width="3"/><text x="160" y="372" font-size="16" fill="#222831">x3</text>
    <circle cx="360" cy="155" r="28" fill="#fff8e8" stroke="#f2994a" stroke-width="3"/><circle cx="360" cy="245" r="28" fill="#fff8e8" stroke="#f2994a" stroke-width="3"/><circle cx="360" cy="335" r="28" fill="#fff8e8" stroke="#f2994a" stroke-width="3"/>
    <circle cx="590" cy="185" r="28" fill="#f0fff4" stroke="#27ae60" stroke-width="3"/><circle cx="590" cy="275" r="28" fill="#f0fff4" stroke="#27ae60" stroke-width="3"/><circle cx="590" cy="365" r="28" fill="#f0fff4" stroke="#27ae60" stroke-width="3"/>
    <circle cx="800" cy="230" r="30" fill="#f7f3ff" stroke="#9b51e0" stroke-width="3"/><text x="800" y="237" font-size="16" fill="#222831">y1</text>
    <circle cx="800" cy="320" r="30" fill="#f7f3ff" stroke="#9b51e0" stroke-width="3"/><text x="800" y="327" font-size="16" fill="#222831">y2</text>
    <text x="160" y="452" font-size="18" font-weight="700" fill="#222831">输入特征</text>
    <text x="360" y="452" font-size="18" font-weight="700" fill="#222831">隐藏层 1</text>
    <text x="590" y="452" font-size="18" font-weight="700" fill="#222831">隐藏层 2</text>
    <text x="800" y="452" font-size="18" font-weight="700" fill="#222831">输出 logits</text>
  </g>
</svg>
