<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" role="img" aria-labelledby="title desc">
  <title id="title">PyTorch 训练循环</title>
  <desc id="desc">PyTorch 训练循环包含读取批次、前向传播、计算损失、清空梯度、反向传播和优化器更新。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#566070"/>
    </marker>
  </defs>
  <rect width="1000" height="520" rx="18" fill="#fbfbfd"/>
  <text x="500" y="54" text-anchor="middle" font-family="Arial, Microsoft YaHei, sans-serif" font-size="30" font-weight="700" fill="#222831">PyTorch 训练循环</text>
  <text x="500" y="88" text-anchor="middle" font-family="Arial, Microsoft YaHei, sans-serif" font-size="16" fill="#5f6b7a">大多数训练代码都在重复同一组步骤</text>
  <g font-family="Arial, Microsoft YaHei, sans-serif" text-anchor="middle">
    <rect x="54" y="190" width="132" height="82" rx="10" fill="#eaf3ff" stroke="#2f80ed" stroke-width="2"/>
    <text x="120" y="224" font-size="18" font-weight="700" fill="#222831">数据批次</text>
    <text x="120" y="250" font-size="14" fill="#5f6b7a">x, y</text>
    <rect x="240" y="190" width="142" height="82" rx="10" fill="#fff8e8" stroke="#f2994a" stroke-width="2"/>
    <text x="311" y="224" font-size="18" font-weight="700" fill="#222831">前向传播</text>
    <text x="311" y="250" font-size="14" fill="#5f6b7a">model(x)</text>
    <rect x="436" y="190" width="132" height="82" rx="10" fill="#fff0f0" stroke="#eb5757" stroke-width="2"/>
    <text x="502" y="224" font-size="18" font-weight="700" fill="#222831">计算损失</text>
    <text x="502" y="250" font-size="14" fill="#5f6b7a">loss_fn</text>
    <rect x="622" y="190" width="142" height="82" rx="10" fill="#f7f3ff" stroke="#9b51e0" stroke-width="2"/>
    <text x="693" y="224" font-size="18" font-weight="700" fill="#222831">反向传播</text>
    <text x="693" y="250" font-size="14" fill="#5f6b7a">loss.backward()</text>
    <rect x="818" y="190" width="132" height="82" rx="10" fill="#f0fff4" stroke="#27ae60" stroke-width="2"/>
    <text x="884" y="224" font-size="18" font-weight="700" fill="#222831">更新参数</text>
    <text x="884" y="250" font-size="14" fill="#5f6b7a">optimizer.step()</text>
  </g>
  <path d="M186 231 H229" stroke="#566070" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M382 231 H425" stroke="#566070" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M568 231 H611" stroke="#566070" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M764 231 H807" stroke="#566070" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M884 272 C835 400 165 400 120 276" stroke="#566070" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <rect x="280" y="378" width="440" height="48" rx="10" fill="#ffffff" stroke="#d4dbe5"/>
  <text x="500" y="408" text-anchor="middle" font-family="Arial, Microsoft YaHei, sans-serif" font-size="16" fill="#222831">下一轮 backward 前要先 optimizer.zero_grad()</text>
</svg>
